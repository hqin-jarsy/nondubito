name: Public-page integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts -p test_web_analytics.py
      - run: python -B scripts/check_web_analytics.py
      - run: python -B -m unittest discover -s scripts -p test_epic_full_editions.py
      - run: python -B scripts/build_epic_full_editions.py --check
      - run: python -B -m unittest discover -s scripts -p test_ancient_full_editions.py
      - run: python -B scripts/build_ancient_full_editions.py --check
      - run: python -B -m unittest discover -s scripts -p test_fables_full_editions.py
      - run: python -B scripts/build_fables_full_editions.py --check
      - run: python -B -m unittest discover -s scripts -p test_analects_full_editions.py
      - run: python -B scripts/build_analects_full_editions.py --check
      - run: python -B scripts/refresh_analects_full_discovery.py --check
      - run: python -B scripts/audit_drama_translations.py
      - run: python -B -m unittest discover -s scripts -p test_drama_series.py
      - run: python -B scripts/build_drama_series.py --check
      - run: python -B scripts/refresh_drama_discovery.py --check
      - run: python -m pip install Markdown==3.9
      - run: python -B -m unittest discover -s scripts -p test_film_full_editions.py
      - run: python -B scripts/build_film_full_editions.py --check
      - run: python -B -m unittest discover -s scripts -p test_film_targeted_english.py
      - run: python -B scripts/refresh_film_full_discovery.py --check
      - run: python -B -m unittest discover -s scripts -p test_wire_full_editions.py
      - run: python -B scripts/build_wire_full_editions.py --check
      - run: python -B scripts/refresh_wire_full_discovery.py --check
      - run: python -B -m unittest discover -s scripts -p test_chernobyl_full_editions.py
      - run: python -B scripts/build_chernobyl_full_editions.py --check
      - run: python -B scripts/refresh_chernobyl_full_discovery.py --check
      - run: python -B -m unittest discover -s scripts -p test_satc_full_editions.py
      - run: python -B scripts/build_satc_full_editions.py --check
      - run: python -B scripts/refresh_satc_full_discovery.py --check
      - run: python -B scripts/check_site_updates.py
      - run: python -B -m unittest discover -s scripts -p test_home_updates.py
      - run: python -B scripts/build_home_updates.py --check
      - run: python -B -m unittest discover -s scripts -p test_reviewed_series_languages.py
      - run: python -B -m unittest discover -s scripts -p test_rewritten_series_languages.py
      - run: python -B -m unittest discover -s scripts -p test_companion_languages.py
      - run: python -B -m unittest discover -s scripts -p test_method_introduction.py
      - run: python -B -m unittest discover -s scripts -p test_action_languages.py
      - run: python -B -m unittest discover -s scripts -p test_state_languages.py
      - run: python -B -m unittest discover -s scripts -p test_interstate_languages.py
      - run: python -B -m unittest discover -s scripts -p test_clustered_language_indexes.py
