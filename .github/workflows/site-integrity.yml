name: Public-page integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts -p test_web_analytics.py
      - run: python -B scripts/check_web_analytics.py
      - run: python -B scripts/check_site_updates.py
      - run: python -B -m unittest discover -s scripts -p test_home_updates.py
      - run: python -B scripts/build_home_updates.py --check
      - run: python -B -m unittest discover -s scripts -p test_reviewed_series_languages.py
      - run: python -B -m unittest discover -s scripts -p test_rewritten_series_languages.py
