<!doctype html><html lang="en"><meta charset="utf-8"><title>Independent Value Amendment Browser Audit</title><style>body{margin:0;background:#e7e9ec;font:14px system-ui}header{position:sticky;top:0;background:#fff;padding:8px;z-index:2;display:flex;gap:10px;align-items:center}button{padding:8px 14px;font:inherit}#label{font-weight:700}#status{padding:4px 10px;background:#fff;font:12px monospace;white-space:pre-wrap}#box{margin:6px auto;position:relative;overflow:hidden}iframe{border:0;transform-origin:top left;background:white}#result{color:#185c29}</style><header><button id="next">Next case</button><button id="focus114">Judgment 114</button><button id="focus137">Judgment 137</button><button id="focus145">Paper 0</button><button id="cycle">Cycle ZH/Hant/EN</button><span id="label">Loading</span></header><div id="status"></div><div id="box"><iframe id="frame"></iframe></div><script>
const languages=['zh','zh-hant','en','ja','de','fr','es','ko'];const cases=[];for(const width of [320,375,1440])for(const language of languages)for(const slug of ['ep01','prospect'])cases.push({width,language,slug});
const frame=document.getElementById('frame'),box=document.getElementById('box'),status=document.getElementById('status'),label=document.getElementById('label');let index=-1,current,expected,results=[];
const normalize=s=>s.replace(/\s+/g,' ').trim();const actual=l=>({'zh':'zh-Hans','zh-hant':'zh-Hant'}[l]||l);const primary=l=>['zh','zh-hant','en'].includes(l);const url=(l,s)=>'/essays/sae-value/'+(primary(l)?'':l+'/')+s+'.html'+(primary(l)?'?lang='+l:'');
function visible(e){return !!e.getClientRects().length&&getComputedStyle(e).display!=='none';}
function body(){return [...frame.contentDocument.querySelectorAll('.essay-body')].find(visible);}
async function record(data){await fetch('/__event__',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});}
function layout(){const scale=Math.min(1,(innerWidth-24)/current.width);const height=Math.floor((innerHeight-100)/scale);frame.style.width=current.width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';box.style.width=(current.width*scale)+'px';box.style.height=(height*scale)+'px';return {scale,height};}
async function check(kind,language=current.language){const d=frame.contentDocument;const bodies=[...d.querySelectorAll('.essay-body')].filter(visible);const u=[...bodies[0].children];const got=u.map(n=>normalize(n.textContent));const want=expected[language+'/'+current.slug];const failures=[];if(bodies.length!==1)failures.push('visible bodies '+bodies.length);if(got.length!==want.length)failures.push('unit count');for(let i=0;i<want.length;i++)if(got[i]!==want[i])failures.push('text unit '+(i+1));if(d.documentElement.lang!==actual(language))failures.push('lang '+d.documentElement.lang);if(d.querySelectorAll('.lang-toggle .lang-btn').length!==8)failures.push('toggles');if(d.documentElement.scrollWidth>current.width+1)failures.push('page overflow '+d.documentElement.scrollWidth);if([...d.querySelectorAll('h1')].filter(visible).length!==1)failures.push('visible titles');const r={kind,index:index+1,...current,language,unitCount:got.length,viewportWidth:frame.contentWindow.innerWidth,scrollWidth:d.documentElement.scrollWidth,htmlLang:d.documentElement.lang,failures,allRenderedUnitsCompared:true};results.push(r);await record(r);return r;}
async function focus(unit){const n=body().children[unit-1];n.scrollIntoView({block:'start'});frame.contentWindow.scrollBy(0,-70);label.textContent=`${index+1}/48 ${current.language} ${current.slug} ${current.width}px | unit ${unit}`;await record({kind:'focus',index:index+1,...current,unit,rect:{width:n.getBoundingClientRect().width,height:n.getBoundingClientRect().height},text:normalize(n.textContent)});}
async function load(){current=cases[index];layout();label.textContent='Loading '+(index+1);status.textContent='Loading final on-disk page';frame.onload=async()=>{await frame.contentDocument.fonts.ready;const r=await check('view');status.textContent=(r.failures.length?'FAIL: '+r.failures.join(', '):'PASS: full visible text / language / 8 toggles / width')+' | '+r.unitCount+' units | innerWidth '+r.viewportWidth+' | scrollWidth '+r.scrollWidth;await focus(current.slug==='ep01'?200:145);document.getElementById('next').disabled=false;};frame.src=url(current.language,current.slug);}
document.getElementById('next').onclick=async()=>{if(index===47){label.textContent='48 / 48 complete';return;}document.getElementById('next').disabled=true;index++;await load();};for(const u of [114,137,145])document.getElementById('focus'+u).onclick=()=>focus(current.slug==='prospect'?u:200);
document.getElementById('cycle').onclick=async()=>{if(!primary(current.language)){status.textContent='Use a primary-language case for cycle';return;}for(const l of ['zh','zh-hant','en','zh-hant','zh']){frame.contentDocument.querySelector('.lang-btn[data-lang="'+l+'"]').click();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const r=await check('language_transition',l);if(r.failures.length){status.textContent='FAIL '+JSON.stringify(r);return;}}status.textContent='PASS: ZH > Hant > EN > Hant > ZH, full visible units match after every click';await focus(current.slug==='ep01'?200:145);};
fetch('/__expected__').then(r=>r.json()).then(x=>{expected=x;document.getElementById('next').click();});
</script></html>
