<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Z-test — HC-16 · Non Dubito</title>
  <meta name="description" content="四个维度，十六种自己。16道题，5分钟，找到你的位置。Z-test by Han Qin.">
  <meta property="og:title" content="Z-test — HC-16 人格图谱">
  <meta property="og:description" content="四个维度，十六种自己。16道题，5分钟。没有Zesi，没有Z-test。">
  <meta property="og:url" content="https://nondubito.net/hc16.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f0f0e;
  --ink2: #1a1a18;
  --cream: #f5f0e8;
  --cream2: #ede8e0;
  --green: #2d4a3e;
  --gold: #b8953a;
  --gold-light: #d4a843;
  --sans: 'Inter', sans-serif;
  --serif: 'EB Garamond', Georgia, serif;
  --cjk: 'Noto Serif SC';
  --max-w: 680px;
  --radius: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--cream);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.hdr {
  position: fixed; top: 0; left: 0; right: 0;
  height: 50px; z-index: 100;
  background: rgba(15,15,14,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(245,240,232,0.07);
  display: flex; align-items: center;
  padding: 0 1.5rem;
  justify-content: space-between;
}
.hdr-logo { font-family: var(--serif); font-size: 0.95rem; color: var(--cream); text-decoration: none; opacity: 0.7; }
.hdr-tag { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,240,232,0.3); }

.hdr-right { display: flex; align-items: center; gap: 1.5rem; }
.lang-toggle { display: flex; align-items: center; gap: 0.5rem; background: none !important; border: none !important; padding: 0 !important; }
.lang-btn { background: none !important; border: none; color: rgba(245,240,232,0.4); font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: color 0.2s; padding: 0.15rem 0.3rem; }
.lang-btn.active { color: var(--cream) !important; font-weight: 500; }
.lang-btn:hover { color: rgba(245,240,232,0.75) !important; }
.lang-sep { color: rgba(245,240,232,0.2); font-size: 0.75rem; }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; padding-top: 50px; }
.screen.active { display: block; }

/* ── INTRO ── */
#s-intro {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  padding: 50px 1.5rem 3rem;
  min-height: 100vh;
  text-align: center;
}
.intro-eyebrow {
  font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); margin-bottom: 1.5rem;
}
.intro-title {
  font-family: var(--cjk), var(--serif);
  font-size: clamp(2.8rem, 8vw, 5rem);
  font-weight: 600; color: var(--cream);
  letter-spacing: 0.05em; margin-bottom: 0.2rem;
  line-height: 1;
}
.intro-title-en {
  font-family: var(--serif);
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  color: rgba(245,240,232,0.25);
  letter-spacing: 0.1em;
  margin-bottom: 2.5rem;
  font-style: italic;
}
.intro-desc {
  font-family: var(--cjk), var(--serif);
  font-size: 1rem; line-height: 1.9;
  color: rgba(245,240,232,0.65);
  max-width: 420px;
  margin-bottom: 3rem;
}
.intro-invite-banner {
  background: rgba(245,240,232,0.05);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);
  padding: 1rem 1.5rem;
  margin-bottom: 2rem;
  max-width: 400px; width: 100%;
  font-family: var(--cjk), serif;
  font-size: 0.88rem;
  color: rgba(245,240,232,0.6);
  line-height: 1.7;
}
.intro-invite-banner strong {
  color: var(--gold-light);
  font-weight: 500;
}
.btn-start {
  background: var(--cream);
  color: var(--ink);
  border: none; border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  padding: 0.9rem 2.5rem;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn-start:hover { background: var(--cream2); }
.btn-start:active { transform: scale(0.98); }
.intro-note {
  margin-top: 1.5rem;
  font-size: 0.65rem;
  color: rgba(245,240,232,0.2);
  letter-spacing: 0.05em;
}

/* ── TEST SCREEN ── */
#s-test { padding: 50px 1.5rem 3rem; }
.test-inner { max-width: var(--max-w); margin: 0 auto; }

.progress-bar-wrap {
  margin: 2rem 0 0.5rem;
  height: 2px;
  background: rgba(245,240,232,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.3s ease;
}
.progress-text {
  display: flex; justify-content: space-between;
  font-size: 0.6rem; letter-spacing: 0.1em;
  color: rgba(245,240,232,0.25);
  margin-bottom: 3rem;
  text-transform: uppercase;
}

.q-dim-label {
  font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(245,240,232,0.25);
  margin-bottom: 1rem;
}
.q-text {
  font-family: var(--cjk), var(--serif);
  font-size: clamp(1rem, 2.5vw, 1.2rem);
  line-height: 1.85;
  color: var(--cream);
  margin-bottom: 2.5rem;
  min-height: 5rem;
}

.options { display: flex; flex-direction: column; gap: 1rem; }
.opt-btn {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(245,240,232,0.1);
  border-radius: var(--radius);
  padding: 1.2rem 1.5rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; gap: 1rem; align-items: flex-start;
}
.opt-btn:hover {
  background: rgba(245,240,232,0.08);
  border-color: rgba(245,240,232,0.2);
}
.opt-btn.selected {
  background: rgba(184,149,58,0.12);
  border-color: rgba(184,149,58,0.4);
}
.opt-letter {
  font-family: var(--serif);
  font-size: 0.8rem;
  color: rgba(245,240,232,0.3);
  min-width: 1.2rem;
  padding-top: 0.1rem;
  font-style: italic;
}
.opt-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.95rem;
  line-height: 1.75;
  color: rgba(245,240,232,0.8);
}

/* ── RESULT SCREEN ── */
#s-result { padding: 50px 0 0; }
.result-hero {
  background: var(--green);
  padding: 4rem 1.5rem 3rem;
  text-align: center;
}
.result-eyebrow {
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(245,240,232,0.4);
  margin-bottom: 1.2rem;
}
.result-code {
  font-family: var(--sans);
  font-size: clamp(2rem, 7vw, 3.2rem);
  font-weight: 300;
  letter-spacing: 0.2em;
  color: var(--cream);
  margin-bottom: 0.4rem;
}
.result-zh {
  font-family: var(--cjk), serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 500;
  color: rgba(245,240,232,0.9);
  margin-bottom: 0.8rem;
}
.result-en-full {
  font-size: 0.72rem; letter-spacing: 0.12em;
  color: rgba(245,240,232,0.35);
  font-family: var(--sans);
  text-transform: uppercase;
  margin-bottom: 1.5rem;
}
.result-tagline {
  font-family: var(--cjk), var(--serif);
  font-size: 1.05rem;
  font-style: italic;
  color: rgba(245,240,232,0.7);
  line-height: 1.7;
  max-width: 380px; margin: 0 auto;
}

.result-body { max-width: var(--max-w); margin: 0 auto; padding: 3rem 1.5rem 4rem; }

.result-section { margin-bottom: 3rem; }
.result-section-label {
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(245,240,232,0.3);
  margin-bottom: 1.2rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid rgba(245,240,232,0.06);
}
.result-dims { display: flex; flex-direction: column; gap: 0.8rem; }
.dim-row {
  display: flex; gap: 0.8rem; align-items: flex-start;
}
.dim-char {
  font-family: var(--cjk), serif;
  font-size: 1.3rem;
  color: var(--gold-light);
  min-width: 2rem;
  line-height: 1.4;
}
.dim-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
}
.result-para {
  font-family: var(--cjk), var(--serif);
  font-size: 0.95rem; line-height: 1.9;
  color: rgba(245,240,232,0.75);
  margin-bottom: 1rem;
}
.result-misunderstood { display: flex; flex-direction: column; gap: 0.8rem; }
.misunderstood-item {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
  padding-left: 1rem;
  border-left: 2px solid rgba(245,240,232,0.1);
}
.result-works { display: flex; flex-direction: column; gap: 1rem; }
.works-block { }
.works-label {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); margin-bottom: 0.4rem;
}
.works-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.92rem; line-height: 1.8;
  color: rgba(245,240,232,0.7);
}

/* ── COMPATIBILITY SECTION ── */
.compat-section {
  background: rgba(245,240,232,0.03);
  border: 1px solid rgba(245,240,232,0.07);
  border-radius: var(--radius);
  padding: 2rem 1.5rem;
  margin-bottom: 2rem;
}
.compat-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; flex-wrap: wrap;
}
.compat-type-chip {
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: 4px;
  padding: 0.4rem 0.8rem;
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--cream);
  letter-spacing: 0.05em;
}
.compat-type-chip.me { background: rgba(184,149,58,0.15); border-color: rgba(184,149,58,0.3); }
.compat-x { color: rgba(245,240,232,0.3); font-size: 0.9rem; }
.compat-zh {
  font-family: var(--cjk), serif;
  font-size: 0.8rem;
  color: rgba(245,240,232,0.4);
}

.compat-grid { display: flex; flex-direction: column; gap: 1rem; }
.compat-row { }
.compat-row-label {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.25); margin-bottom: 0.4rem;
}
.compat-row-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
}
.compat-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
.compat-chip {
  font-family: var(--cjk), serif;
  font-size: 0.75rem;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  border: 1px solid;
}
.compat-chip.green { color: rgba(150,200,150,0.8); border-color: rgba(150,200,150,0.3); background: rgba(150,200,150,0.06); }
.compat-chip.amber { color: rgba(220,160,80,0.8); border-color: rgba(220,160,80,0.3); background: rgba(220,160,80,0.06); }
.compat-chip.red { color: rgba(200,100,100,0.8); border-color: rgba(200,100,100,0.3); background: rgba(200,100,100,0.06); }

/* ── FEEDBACK ── */
.feedback-wrap {
  max-width: var(--max-w);
  margin: 0 auto 1.5rem;
  padding: 0 1.5rem;
}
.feedback-box {
  border: 1px solid rgba(245,240,232,0.08);
  border-radius: var(--radius);
  padding: 1.4rem 1.5rem;
  text-align: center;
}
.feedback-q {
  font-family: var(--cjk), var(--serif);
  font-size: 0.82rem;
  color: rgba(245,240,232,0.4);
  letter-spacing: 0.04em;
  margin-bottom: 1rem;
}
.feedback-btns { display: flex; gap: 0.6rem; justify-content: center; }
.feedback-btn {
  background: none;
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius);
  color: rgba(245,240,232,0.45);
  font-family: var(--cjk), var(--sans);
  font-size: 0.78rem;
  padding: 0.5rem 1.1rem;
  cursor: pointer;
  transition: all 0.15s;
}
.feedback-btn:hover { border-color: rgba(245,240,232,0.3); color: rgba(245,240,232,0.7); }
.feedback-btn.yes:hover { border-color: rgba(150,200,150,0.4); color: rgba(150,200,150,0.8); }
.feedback-btn.no:hover  { border-color: rgba(220,160,80,0.4);  color: rgba(220,160,80,0.8); }
.feedback-detail {
  margin-top: 1.2rem;
  text-align: left;
  display: none;
}
.feedback-detail.open { display: block; }
.feedback-label {
  font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.25); margin-bottom: 0.5rem;
}
.feedback-select {
  width: 100%;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);
  color: rgba(245,240,232,0.7);
  font-family: var(--cjk), var(--sans);
  font-size: 0.85rem;
  padding: 0.6rem 0.8rem;
  margin-bottom: 0.8rem;
  appearance: none;
}
.feedback-select option { background: #1a1a18; }
.feedback-note {
  width: 100%;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);
  color: rgba(245,240,232,0.7);
  font-family: var(--cjk), var(--sans);
  font-size: 0.82rem;
  padding: 0.6rem 0.8rem;
  resize: vertical;
  min-height: 70px;
  margin-bottom: 0.8rem;
  box-sizing: border-box;
}
.feedback-note::placeholder { color: rgba(245,240,232,0.2); }
.feedback-submit {
  width: 100%;
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius);
  color: rgba(245,240,232,0.6);
  font-family: var(--sans);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  padding: 0.6rem;
  cursor: pointer;
  transition: all 0.15s;
}
.feedback-submit:hover { background: rgba(245,240,232,0.12); color: rgba(245,240,232,0.85); }
.feedback-done {
  font-family: var(--cjk), var(--serif);
  font-size: 0.82rem;
  color: rgba(150,200,150,0.7);
  text-align: center;
  display: none;
  padding: 0.3rem 0;
}

/* ── CTA ── */
.cta-area {
  text-align: center;
  padding: 0 1.5rem 4rem;
  max-width: var(--max-w);
  margin: 0 auto;
}
.btn-invite {
  display: block; width: 100%;
  background: var(--cream);
  color: var(--ink);
  border: none; border-radius: var(--radius);
  font-family: var(--cjk), var(--sans);
  font-size: 0.95rem;
  font-weight: 500;
  padding: 1rem;
  cursor: pointer;
  margin-bottom: 0.8rem;
  transition: background 0.15s;
}
.btn-invite:hover { background: var(--cream2); }
.btn-share {
  display: block; width: 100%;
  background: transparent;
  color: rgba(245,240,232,0.5);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  padding: 0.8rem;
  cursor: pointer;
  margin-bottom: 0.8rem;
  transition: all 0.15s;
}
.btn-share:hover { border-color: rgba(245,240,232,0.3); color: rgba(245,240,232,0.7); }
.btn-retake {
  display: block; width: 100%;
  background: transparent;
  color: rgba(245,240,232,0.25);
  border: none;
  font-family: var(--sans);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 0.5rem;
  cursor: pointer;
  margin-bottom: 2rem;
  text-transform: uppercase;
  transition: color 0.15s;
}
.btn-retake:hover { color: rgba(245,240,232,0.45); }
.cta-back {
  display: block;
  font-family: var(--sans);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.18);
  text-decoration: none;
  transition: color 0.2s;
  margin-top: 1rem;
}
.cta-back:hover { color: rgba(245,240,232,0.35); }

.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: var(--ink2);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);
  padding: 0.7rem 1.4rem;
  font-family: var(--cjk), var(--sans);
  font-size: 0.85rem;
  color: var(--cream);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

@media (max-width: 400px) {
  .result-code { letter-spacing: 0.12em; }
}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" class="hdr-logo">Non Dubito</a>
  <div class="hdr-right">
    <span class="hdr-tag">Z-TEST</span>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-zh" onclick="setLang('zh')">中文</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</div>

<!-- ── INTRO ── -->
<div id="s-intro" class="screen active">
  <p class="intro-eyebrow">Self-as-an-End Theory · Han Qin (秦汉)</p>
  <div class="intro-title">Z-test</div>
  <div class="intro-title-en">HC-16 · Personality Profile</div>
  <div id="invite-banner" class="intro-invite-banner" style="display:none"></div>
  <p class="intro-desc" id="intro-desc-text"></p>
  <button class="btn-start" onclick="startTest()" id="btn-start-text"></button>
  <p class="intro-note">DOI: 10.5281/zenodo.18907264 &nbsp;·&nbsp; nondubito.net</p>
</div>

<!-- ── TEST ── -->
<div id="s-test" class="screen" style="display:none">
  <div class="test-inner">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pbar" style="width:0%"></div></div>
    <div class="progress-text">
      <span id="p-dim"></span>
      <span id="p-num"></span>
    </div>
    <div class="q-dim-label" id="q-dim-label"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
  </div>
</div>

<!-- ── RESULT ── -->
<div id="s-result" class="screen" style="display:none">
  <div class="result-hero">
    <p class="result-eyebrow" id="result-eyebrow-text"></p>
    <div class="result-code" id="r-code"></div>
    <div class="result-zh" id="r-zh"></div>
    <div class="result-en-full" id="r-en"></div>
    <div class="result-tagline" id="r-tagline"></div>
  </div>
  <div class="result-body">
    <div class="result-section">
      <div class="result-section-label" id="section-channels"></div>
      <div class="result-dims" id="r-dims"></div>
    </div>
    <div class="result-section">
      <div class="result-section-label" id="section-love"></div>
      <div id="r-love"></div>
    </div>
    <div class="result-section">
      <div class="result-section-label" id="section-career"></div>
      <div id="r-career"></div>
    </div>
    <div class="result-section">
      <div class="result-section-label" id="section-finance"></div>
      <div id="r-finance"></div>
    </div>
    <div class="result-section">
      <div class="result-section-label" id="section-misread"></div>
      <div id="r-misunderstood"></div>
    </div>
    <div class="result-section">
      <div class="result-section-label" id="section-must"></div>
      <div id="r-must"></div>
    </div>
    <div id="r-compat"></div>

    misread_en:['Others think you "have no ambitions" → Your ambitions exist differently — not in bright moments, but in daily earnestness, in genuine presence over time.','Others think you\'re "not interesting enough" → Your interestingness is deep, not surface-level. It takes time to be seen.'],
    must:['你不得不感到稳定——当周围一切都在晃动时，你需要有一块真正属于自己的地。','你不得不感到自己在做一件持续、真实的事情，而不是在跑一个又一个短期的项目。'],
    must_en:['You must feel stable — when everything around you is shaking, you need real ground of your own.','You must feel you\'re doing something continuous and real — not running from one short-term project to the next.'],
  },
};

// ────────────────────────────────────────────────────────────────────────────
// RENDERING FUNCTIONS
// ────────────────────────────────────────────────────────────────────────────

function dimLabel(dim) {
  const idx = DIM_KEYS.indexOf(dim);
  return currentLang === 'en' ? DIM_EN[idx] : DIM_ZH[idx];
}

function typeIsHigh(code, dim) {
  const idx = DIM_KEYS.indexOf(dim);
  const letters = ['D','F','E','R'];
  return code[idx] === letters[idx];
}

function renderQuestion() {
  const q = Q[cur];
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;
  const pct = (cur / 16) * 100;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('p-dim').textContent = dimLabel(q.dim);
  document.getElementById('p-num').textContent = s.question_header(cur);
  document.getElementById('q-dim-label').textContent = dimLabel(q.dim);
  
  const text = currentLang === 'en' ? q.text_en : q.text;
  document.getElementById('q-text').textContent = text;

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  const options = currentLang === 'en' ? q.opts_en : q.opts;
  const letters = ['A','B','C','D'];
  options.forEach((txt, i) => {
    const letter = letters[i];
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    if (answers[cur] === letter) btn.classList.add('selected');
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span class="opt-text">${txt}</span>`;
    btn.onclick = () => selectAnswer(letter);
    opts.appendChild(btn);
  });
}

function selectAnswer(letter) {
  answers[cur] = letter;
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  const letters = ['A','B','C','D'];
  const idx = letters.indexOf(letter);
  if (idx >= 0) document.querySelectorAll('.opt-btn')[idx].classList.add('selected');
  setTimeout(() => {
    cur++;
    if (cur < 16) {
      renderQuestion();
    } else {
      calcResult();
    }
  }, 280);
}

function calcResult() {
  const slices = [answers.slice(0,4), answers.slice(4,8), answers.slice(8,12), answers.slice(12,16)];
  const scores = slices.map((dimAnswers, di) => {
    return dimAnswers.reduce((sum, letter, qi) => {
      if (!letter) return sum;
      const scoreMap = QSCORES[di * 4 + qi];
      return sum + (scoreMap[letter] || 0);
    }, 0);
  });
  const high = scores.map(s => s >= 7);
  const code = [
    high[0] ? 'D' : 'C',
    high[1] ? 'F' : 'T',
    high[2] ? 'E' : 'A',
    high[3] ? 'R' : 'B'
  ].join('');
  showResult(code);
}

function showResult(code) {
  const t = TYPES[code];
  if (!t) { showResult('DFER'); return; }
  
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;
  window._myType = code;

  document.getElementById('result-eyebrow-text').textContent = s.result_eyebrow;
  document.getElementById('r-code').textContent = code;
  document.getElementById('r-zh').textContent = t.zh;
  document.getElementById('r-en').textContent = t.en;
  document.getElementById('r-tagline').textContent = currentLang === 'en' ? t.tagline_en : t.tagline;

  document.getElementById('section-channels').textContent = s.section_channels;
  document.getElementById('section-love').textContent = s.section_love;
  document.getElementById('section-career').textContent = s.section_career;
  document.getElementById('section-finance').textContent = s.section_finance;
  document.getElementById('section-misread').textContent = s.section_misread;
  document.getElementById('section-must').textContent = s.section_must;

  const dimsEl = document.getElementById('r-dims');
  if (dimsEl && t.dims && t.dims.length > 0) {
    dimsEl.innerHTML = t.dims.map(d => {
      const text = currentLang === 'en' ? d.en : d.text;
      return `<div class="dim-row"><div class="dim-char">${d.char}</div><div class="dim-text">${text}</div></div>`;
    }).join('');
  }

  const love = currentLang === 'en' ? t.love_en : t.love;
  const career = currentLang === 'en' ? t.career_en : t.career;
  const finance = currentLang === 'en' ? t.finance_en : t.finance;
  document.getElementById('r-love').innerHTML = `<p class="result-para">${love}</p>`;
  document.getElementById('r-career').innerHTML = `<p class="result-para">${career}</p>`;
  document.getElementById('r-finance').innerHTML = `<p class="result-para">${finance}</p>`;

  const misread = currentLang === 'en' ? t.misread_en : t.misread;
  document.getElementById('r-misunderstood').innerHTML =
    misread.map(m => `<div class="misunderstood-item">${m}</div>`).join('');

  const must = currentLang === 'en' ? t.must_en : t.must;
  document.getElementById('r-must').innerHTML =
    must.map(m => `<p class="result-para" style="margin-bottom:0.5rem;padding-left:1rem;border-left:2px solid rgba(184,149,58,0.3);">${m}</p>`).join('');

  const compatEl = document.getElementById('r-compat');
  if (fromType && TYPES[fromType] && fromType !== code) {
    compatEl.innerHTML = renderCompat(fromType, code);
  } else {
    compatEl.innerHTML = '';
  }

  document.getElementById('btn-invite').textContent = s.btn_invite;
  document.getElementById('btn-share-text').textContent = s.btn_share;
  document.getElementById('btn-retake-text').textContent = s.btn_retake;
  document.getElementById('cta-back-text').textContent = s.cta_back;
  const typePageBtn = document.getElementById('btn-type-page');
  typePageBtn.href = 'hc16/' + code + '.html';
  typePageBtn.textContent = currentLang === 'en' ? 'Full profile: ' + code + ' →' : '查看完整档案：' + code + ' →';

  show('s-result');
}

// ────────────────────────────────────────────────────────────────────────────
// UTILITIES & INTERACTION
// ────────────────────────────────────────────────────────────────────────────

function renderCompat(t1, t2) {
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;
  const complement = [], friction = [], blindspot = [];
  DIM_KEYS.forEach((dim, i) => {
    const h1 = typeIsHigh(t1, dim);
    const h2 = typeIsHigh(t2, dim);
    if (h1 && h2) friction.push(i);
    else if (!h1 && !h2) blindspot.push(i);
    else complement.push(i);
  });

  const dimLabels = currentLang === 'en' ? DIM_EN : DIM_ZH;
  const chipHtml = (arr, cls) => arr.map(i =>
    `<span class="compat-chip ${cls}">${dimLabels[i]}</span>`).join('');

  return `
  <div class="compat-section">
    <div class="compat-header">
      <div>
        <div style="font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,240,232,0.25);margin-bottom:0.5rem;">${s.compat_title}</div>
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
          <span class="compat-type-chip">${t1}</span>
          <span class="compat-zh">${TYPES[t1].zh}</span>
          <span class="compat-x">×</span>
          <span class="compat-type-chip">${t2}</span>
          <span class="compat-zh">${TYPES[t2].zh}</span>
        </div>
      </div>
    </div>
    <div class="compat-grid">
      ${complement.length ? `
      <div class="compat-row">
        <div class="compat-row-label">${s.compat_complement}</div>
        <div class="compat-row-text">${s.compat_complement_desc}</div>
        <div class="compat-chips">${chipHtml(complement,'green')}</div>
      </div>` : ''}
      ${friction.length ? `
      <div class="compat-row">
        <div class="compat-row-label">${s.compat_friction}</div>
        <div class="compat-row-text">${s.compat_friction_desc}</div>
        <div class="compat-chips">${chipHtml(friction,'amber')}</div>
      </div>` : ''}
      ${blindspot.length ? `
      <div class="compat-row">
        <div class="compat-row-label">${s.compat_blindspot}</div>
        <div class="compat-row-text">${s.compat_blindspot_desc}</div>
        <div class="compat-chips">${chipHtml(blindspot,'red')}</div>
      </div>` : ''}
    </div>
  </div>`;
}

function updateIntroLang() {
  const intro = document.getElementById('s-intro');
  if (!intro) return;
  const titleZh = intro.querySelector('[data-text-zh-title]');
  const titleEn = intro.querySelector('[data-text-en-title]');
  const descZh = intro.querySelector('[data-text-zh-desc]');
  const descEn = intro.querySelector('[data-text-en-desc]');
  const btnZh = intro.querySelector('[data-text-zh-btn]');
  const btnEn = intro.querySelector('[data-text-en-btn]');
  if (titleZh && titleEn) { titleZh.style.display = currentLang === 'zh' ? 'block' : 'none'; titleEn.style.display = currentLang === 'en' ? 'block' : 'none'; }
  if (descZh && descEn) { descZh.style.display = currentLang === 'zh' ? 'block' : 'none'; descEn.style.display = currentLang === 'en' ? 'block' : 'none'; }
  if (btnZh && btnEn) { btnZh.textContent = currentLang === 'zh' ? '开始测试' : 'Start Test'; btnEn.textContent = currentLang === 'zh' ? '开始测试' : 'Start Test'; }
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('hc16lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
  rerenderCurrent();
  fbUpdateLang();
}

function rerenderCurrent() {
  const testScreen = document.getElementById('s-test');
  const resultScreen = document.getElementById('s-result');
  if (testScreen && testScreen.classList.contains('active')) {
    renderQuestion();
  } else if (resultScreen && resultScreen.classList.contains('active')) {
    const code = window._myType || 'DFER';
    showResult(code);
  } else {
    updateIntroLang();
  }
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startTest() {
  cur = 0;
  answers = ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', ''];
  show('s-test');
  renderQuestion();
}

function retake() {
  // reset feedback widget for next attempt
  const detail = document.getElementById('fb-detail');
  const done   = document.getElementById('fb-done');
  const btns   = document.getElementById('fb-btns');
  const q      = document.getElementById('fb-q-text');
  if (detail) detail.classList.remove('open');
  if (done)   done.style.display = 'none';
  if (btns)   btns.style.display = '';
  if (q)      q.style.display = '';
  document.querySelectorAll('.feedback-btn').forEach(b => b.style.display = '');
  const sel = document.getElementById('fb-type');
  if (sel) sel.value = '';
  const note = document.getElementById('fb-note');
  if (note) note.value = '';
  startTest();
}

function shareInvite() {
  const code = window._myType || 'DFER';
  const t = TYPES[code];
  const typeStr = currentLang === 'en' ? `${code} · ${t.en}` : `${code} · ${t.zh}`;
  const urlText = currentLang === 'en' ? 'See relationship analysis' : '看看我们之间的关系';
  const url = `https://nondubito.net/hc16.html?from=${code}`;
  const text = currentLang === 'en' 
    ? `I took Z-test (HC-16), my type is ${typeStr}. Take the test too and we can see our compatibility — ${url}`
    : `我测了 Z-test，是 ${typeStr}。来测你的类型，看看我们之间的关系——${url}`;
  if (navigator.share) {
    navigator.share({ title: 'HC-16', text });
  } else {
    copyToClipboard(url, currentLang === 'en' ? 'Link copied' : '邀请链接已复制 →');
  }
}

function shareResult() {
  const code = window._myType || 'DFER';
  const t = TYPES[code];
  const typeStr = currentLang === 'en' ? `${code} · ${t.en}` : `${code} · ${t.zh}`;
  const tagline = currentLang === 'en' ? t.tagline_en : t.tagline;
  const text = `Z-test (HC-16): ${typeStr}
"${tagline}"
Take the test: https://nondubito.net/hc16.html`;
  if (navigator.share) {
    navigator.share({ title: `Z-test: ${typeStr}`, text, url: `https://nondubito.net/hc16.html?result=${code}` });
  } else {
    copyToClipboard(text, currentLang === 'en' ? 'Copied to clipboard' : '结果已复制到剪贴板');
  }
}

function copyToClipboard(text, msg) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast(msg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(msg);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (t) {
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
}

// ── FEEDBACK ─────────────────────────────────────────────────────────────────
// Set your Formspree form ID at https://formspree.io/ (free, 50 submissions/mo)
// Example: const FEEDBACK_URL = 'https://formspree.io/f/xyzabcde';
const FEEDBACK_URL = 'https://formspree.io/f/mjgakdow';

function fbUpdateLang() {
  const isEn = currentLang === 'en';
  const q = document.getElementById('fb-q-text');
  const lt = document.getElementById('fb-label-type');
  const ln = document.getElementById('fb-label-note');
  const sb = document.getElementById('fb-submit-btn');
  const fn = document.getElementById('fb-note');
  const fd = document.getElementById('fb-done');
  if (q)  q.textContent  = isEn ? 'Did this result resonate with you?' : '这个结果说中你了吗？';
  if (lt) lt.textContent = isEn ? 'Which type feels more like you?' : '你觉得自己更像哪个类型？';
  if (ln) ln.textContent = isEn ? 'What felt off? (optional)' : '哪里感觉不对？（可选）';
  if (sb) sb.textContent = isEn ? 'Submit' : '提交反馈';
  if (fn) fn.placeholder = isEn ? 'Anything helps us improve the test…' : '随便说几句，对我们改进测试很有帮助…';
  if (fd) fd.textContent = isEn ? 'Thank you — this is really helpful.' : '谢谢，这个反馈很有价值。';
  const yesBtn = document.querySelector('.feedback-btn.yes');
  const noBtn  = document.querySelector('.feedback-btn.no');
  if (yesBtn) yesBtn.textContent = isEn ? 'Yes, it fits' : '准，说中了';
  if (noBtn)  noBtn.textContent  = isEn ? 'Not quite me' : '不太像我';
}

function fbYes() {
  document.getElementById('fb-btns').style.display = 'none';
  const done = document.getElementById('fb-done');
  done.textContent = currentLang === 'en' ? '✓ Good to know.' : '✓ 好，知道了。';
  done.style.display = 'block';
  fbSend({ result: window._myType || '', felt: window._myType || '', accurate: 'yes', note: '' });
}

function fbNo() {
  document.getElementById('fb-detail').classList.add('open');
  document.querySelector('.feedback-btn.no').style.display = 'none';
  document.querySelector('.feedback-btn.yes').style.display = 'none';
  document.getElementById('fb-q-text').style.display = 'none';
}

function fbSubmit() {
  const felt = document.getElementById('fb-type').value;
  const note = document.getElementById('fb-note').value.trim();
  if (!felt) {
    const select = document.getElementById('fb-type');
    select.style.borderColor = 'rgba(220,100,100,0.4)';
    setTimeout(() => select.style.borderColor = '', 1200);
    return;
  }
  fbSend({ result: window._myType || '', felt, accurate: 'no', note });
  document.getElementById('fb-detail').classList.remove('open');
  document.getElementById('fb-done').style.display = 'block';
}

async function fbSend(data) {
  if (!FEEDBACK_URL) return;
  try {
    await fetch(FEEDBACK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data),
    });
  } catch(e) { /* silent fail */ }
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  const langBtn = document.querySelector(`[data-lang="${currentLang}"]`);
  if (langBtn) langBtn.classList.add('active');
  updateIntroLang();
});
</script>
