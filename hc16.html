<style>
:root {
  --ink: #0f0f0e;
  --ink2: #1a1a18;
  --cream: #f5f0e8;
  --cream2: #ede8e0;
  --green: #2d4a3e;
  --gold: #b8953a;
  --gold-light: #d4a843;
  --sans: 'Inter', sans-serif;
  --serif: 'EB Garamond', Georgia, serif;
  --cjk: 'Noto Serif SC';
  --max-w: 680px;
  --radius: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--cream);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.hdr {
  position: fixed; top: 0; left: 0; right: 0;
  height: 50px; z-index: 100;
  background: rgba(15,15,14,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(245,240,232,0.07);
  display: flex; align-items: center;
  padding: 0 1.5rem;
  justify-content: space-between;
}
.hdr-logo { font-family: var(--serif); font-size: 0.95rem; color: var(--cream); text-decoration: none; opacity: 0.7; }
.hdr-tag { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,240,232,0.3); }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; padding-top: 50px; }
.screen.active { display: block; }

/* ── INTRO ── */
#s-intro {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  padding: 50px 1.5rem 3rem;
  min-height: 100vh;
  text-align: center;
}
.intro-eyebrow {
  font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); margin-bottom: 1.5rem;
}
.intro-title {
  font-family: var(--cjk), var(--serif);
  font-size: clamp(2.8rem, 8vw, 5rem);
  font-weight: 600; color: var(--cream);
  letter-spacing: 0.05em; margin-bottom: 0.2rem;
  line-height: 1;
}
.intro-title-en {
  font-family: var(--serif);
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  color: rgba(245,240,232,0.25);
  letter-spacing: 0.1em;
  margin-bottom: 2.5rem;
  font-style: italic;
}
.intro-desc {
  font-family: var(--cjk), var(--serif);
  font-size: 1rem; line-height: 1.9;

  margin-bottom: 3rem;
}
.intro-invite-banner {
  background: rgba(245,240,232,0.05);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);
  padding: 1rem 1.5rem;
  margin-bottom: 2rem;
  max-width: 400px; width: 100%;
  font-family: var(--cjk), serif;
  font-size: 0.88rem;
  color: rgba(245,240,232,0.6);

}
.intro-invite-banner strong {
  color: var(--gold-light);

}
.btn-start {

  letter-spacing: 0.05em;

}
.btn-start:hover { background: var(--cream2); }

.intro-note {
  margin-top: 1.5rem;
  font-size: 0.65rem;
  color: rgba(245,240,232,0.2);
  letter-spacing: 0.05em;
}

/* ── TEST SCREEN ── */
#s-test { padding: 50px 1.5rem 3rem; }
.test-inner { max-width: var(--max-w); margin: 0 auto; }

.progress-bar-wrap {
  margin: 2rem 0 0.5rem;
  height: 2px;
  background: rgba(245,240,232,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.3s ease;
}
.progress-text {
  display: flex; justify-content: space-between;
  font-size: 0.6rem; letter-spacing: 0.1em;
  color: rgba(245,240,232,0.25);
  margin-bottom: 3rem;

}

.q-dim-label {
  font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(245,240,232,0.25);
  margin-bottom: 1rem;
}
.q-text {
  font-family: var(--cjk), var(--serif);
  font-size: clamp(1rem, 2.5vw, 1.2rem);
  line-height: 1.85;
  color: var(--cream);
  margin-bottom: 2.5rem;
  min-height: 5rem;
}

.options { display: flex; flex-direction: column; gap: 1rem; }
.opt-btn {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(245,240,232,0.1);
  border-radius: var(--radius);
  padding: 1.2rem 1.5rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; gap: 1rem; align-items: flex-start;
}
.opt-btn:hover {
  background: rgba(245,240,232,0.08);
  border-color: rgba(245,240,232,0.2);
}
.opt-btn.selected {
  background: rgba(184,149,58,0.12);
  border-color: rgba(184,149,58,0.4);
}
.opt-letter {
  font-family: var(--serif);
  font-size: 0.8rem;
  color: rgba(245,240,232,0.3);
  min-width: 1.2rem;
  padding-top: 0.1rem;
  font-style: italic;
}
.opt-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.95rem;
  line-height: 1.75;
  color: rgba(245,240,232,0.8);
}

/* ── RESULT SCREEN ── */
#s-result { padding: 50px 0 0; }
.result-hero {
  background: var(--green);
  padding: 4rem 1.5rem 3rem;
  text-align: center;
}
.result-eyebrow {
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(245,240,232,0.4);
  margin-bottom: 1.2rem;
}
.result-code {
  font-family: var(--sans);
  font-size: clamp(2rem, 7vw, 3.2rem);
  font-weight: 300;
  letter-spacing: 0.2em;
  color: var(--cream);
  margin-bottom: 0.4rem;
}
.result-zh {
  font-family: var(--cjk), serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 500;
  color: rgba(245,240,232,0.9);
  margin-bottom: 0.8rem;
}
.result-en-full {
  font-size: 0.72rem; letter-spacing: 0.12em;
  color: rgba(245,240,232,0.35);
  font-family: var(--sans);
  text-transform: uppercase;
  margin-bottom: 1.5rem;
}
.result-tagline {
  font-family: var(--cjk), var(--serif);
  font-size: 1.05rem;
  font-style: italic;
  color: rgba(245,240,232,0.7);
  line-height: 1.7;
  max-width: 380px; margin: 0 auto;
}

.result-body { max-width: var(--max-w); margin: 0 auto; padding: 3rem 1.5rem 4rem; }

.result-section { margin-bottom: 3rem; }
.result-section-label {
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(245,240,232,0.3);
  margin-bottom: 1.2rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid rgba(245,240,232,0.06);
}
.result-dims { display: flex; flex-direction: column; gap: 0.8rem; }
.dim-row {
  display: flex; gap: 0.8rem; align-items: flex-start;
}
.dim-char {
  font-family: var(--cjk), serif;
  font-size: 1.3rem;
  color: var(--gold-light);
  min-width: 2rem;
  line-height: 1.4;
}
.dim-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
}
.result-para {
  font-family: var(--cjk), var(--serif);
  font-size: 0.95rem; line-height: 1.9;
  color: rgba(245,240,232,0.75);
  margin-bottom: 1rem;
}
.result-misunderstood { display: flex; flex-direction: column; gap: 0.8rem; }
.misunderstood-item {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
  padding-left: 1rem;
  border-left: 2px solid rgba(245,240,232,0.1);
}
.result-works { display: flex; flex-direction: column; gap: 1rem; }
.works-block { }
.works-label {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); margin-bottom: 0.4rem;
}
.works-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.92rem; line-height: 1.8;
  color: rgba(245,240,232,0.7);
}

/* ── COMPATIBILITY SECTION ── */
.compat-section {
  background: rgba(245,240,232,0.03);
  border: 1px solid rgba(245,240,232,0.07);
  border-radius: var(--radius);
  padding: 2rem 1.5rem;
  margin-bottom: 2rem;
}
.compat-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; flex-wrap: wrap;
}
.compat-type-chip {
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: 4px;
  padding: 0.4rem 0.8rem;
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--cream);
  letter-spacing: 0.05em;
}
.compat-type-chip.me { background: rgba(184,149,58,0.15); border-color: rgba(184,149,58,0.3); }
.compat-x { color: rgba(245,240,232,0.3); font-size: 0.9rem; }
.compat-zh {
  font-family: var(--cjk), serif;
  font-size: 0.8rem;
  color: rgba(245,240,232,0.4);
}

.compat-grid { display: flex; flex-direction: column; gap: 1rem; }
.compat-row { }
.compat-row-label {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.25); margin-bottom: 0.4rem;
}
.compat-row-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
}
.compat-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
.compat-chip {
  font-family: var(--cjk), serif;
  font-size: 0.75rem;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  border: 1px solid;
}
.compat-chip.green { color: rgba(150,200,150,0.8); border-color: rgba(150,200,150,0.3); background: rgba(150,200,150,0.06); }
.compat-chip.amber { color: rgba(220,160,80,0.8); border-color: rgba(220,160,80,0.3); background: rgba(220,160,80,0.06); }
.compat-chip.red { color: rgba(200,100,100,0.8); border-color: rgba(200,100,100,0.3); background: rgba(200,100,100,0.06); }

/* ── CTA ── */
.cta-area {
  text-align: center;
  padding: 0 1.5rem 4rem;
  max-width: var(--max-w);
  margin: 0 auto;
}
.btn-invite {
  display: block; width: 100%;
  background: var(--cream);
  color: var(--ink);
  border: none; border-radius: var(--radius);
  font-family: var(--cjk), var(--sans);
  font-size: 0.95rem;
  font-weight: 500;
  padding: 1rem;
  cursor: pointer;
  margin-bottom: 0.8rem;
  transition: background 0.15s;
}
.btn-invite:hover { background: var(--cream2); }
.btn-share {
  display: block; width: 100%;
  background: transparent;
  color: rgba(245,240,232,0.5);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  padding: 0.8rem;
  cursor: pointer;
  margin-bottom: 0.8rem;
  transition: all 0.15s;
}
.btn-share:hover { border-color: rgba(245,240,232,0.3); color: rgba(245,240,232,0.7); }
.btn-retake {
  display: block; width: 100%;
  background: transparent;
  color: rgba(245,240,232,0.25);
  border: none;
  font-family: var(--sans);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 0.5rem;
  cursor: pointer;
  margin-bottom: 2rem;
  text-transform: uppercase;
  transition: color 0.15s;
}
.btn-retake:hover { color: rgba(245,240,232,0.45); }
.cta-back {
  display: block;
  font-family: var(--sans);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.18);
  text-decoration: none;
  transition: color 0.2s;
  margin-top: 1rem;
}
.cta-back:hover { color: rgba(245,240,232,0.35); }

.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: var(--ink2);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);
  padding: 0.7rem 1.4rem;
  font-family: var(--cjk), var(--sans);
  font-size: 0.85rem;
  color: var(--cream);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

@media (max-width: 400px) {
  .result-code { letter-spacing: 0.12em; }
}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" class="hdr-logo">Non Dubito</a>

</div>

<!-- ── INTRO ── -->
<div id="s-intro" class="screen active">
  <p class="intro-eyebrow">Self-as-an-End Theory · Han Qin (秦汉)</p>
  <div class="intro-title">HC-16</div>
  <div class="intro-title-en">Vulnerability Profile System</div>
  <div id="invite-banner" class="intro-invite-banner" style="display:none"></div>
  <p class="intro-desc">每个人都有四种结构性痛苦的敏感度配置——你对哪种痛苦最敏感，决定了你在哪里最容易崩溃，以及什么修复对你最有效。<br><br>这不是性格标签。是你的脆弱性地图。</p>

<!-- ── RESULT ── -->
<div id="s-result" class="screen">
  <div class="result-hero">
    <p class="result-eyebrow">你的 HC-16 类型</p>
    <div class="result-code" id="r-code"></div>
    <div class="result-zh" id="r-zh"></div>

      <div class="result-section-label">你的日常模式</div>

      <div class="result-section-label">你最容易掉的坑</div>

<script>
// ── QUESTIONS ────────────────────────────────────────────────────────────
const Q = [
  // 求不得 (Drive/Composed)
  { dim:'drive', label:'求不得',
    text:'当你连续几周没有任何进展——项目卡住了，学的东西没有突破，生活没有变化——你的内在状态更接近哪个？',
    a:'一种说不出的焦躁，像有什么东西在体内推着你，必须动起来',
    b:'还好，节奏慢一点也没什么，不急' },
  { dim:'drive', label:'求不得',
    text:'你刚完成了一个重要的目标。完成的那一刻，你的第一反应更接近哪个？',
    a:'短暂的满足，然后很快开始想"下一个是什么"',
    b:'可以好好享受一阵子，不需要马上想下一步' },
  { dim:'drive', label:'求不得',
    text:'一个你很在意的项目因为外部原因被彻底取消了，不是你的问题。你的反应更接近哪个？',
    a:'像被抽空了一块，即使知道不是自己的错，还是很痛',
    b:'遗憾，但能比较快地接受，转向别的事情' },
  { dim:'drive', label:'求不得',
    text:'有人跟你说"你不需要一直在追什么，停下来也是可以的"。你的内心反应更接近哪个？',
    a:'道理我都懂，但停下来比继续走更难受',
    b:'说得对，我确实不需要一直在赶路' },

  // 不可忍 (Fierce/Tolerant)
  { dim:'fierce', label:'不可忍',
    text:'在一个团队合作中，你发现你的贡献被别人拿去邀功，而你被当作"执行的人"。你的反应更接近哪个？',
    a:'立刻感到不对，很难忍，就算不当场说也会很快找机会说清楚',
    b:'不太舒服，但可以先放一放，不值得为这个起冲突' },
  { dim:'fierce', label:'不可忍',
    text:'一个你信任的人在背后用一种你觉得不公平的方式评价你。你知道之后的反应更接近哪个？',
    a:'被刺痛了，这件事会反复出现在脑子里，必须处理',
    b:'有点失望，但人各有看法，不至于太影响我' },
  { dim:'fierce', label:'不可忍',
    text:'你的老板（或长辈）在公开场合用一种带有贬低意味的方式纠正你。你的内在反应更接近哪个？',
    a:'尊严被踩了，无论他说的内容对不对，这种方式我无法接受',
    b:'不太舒服，但如果他说的内容有道理，我可以先消化内容再处理方式问题' },
  { dim:'fierce', label:'不可忍',
    text:'有人长期对你很好，但你渐渐发现这种好里面有一种"我是在帮你/带你"的居高临下。你的反应更接近哪个？',
    a:'一旦察觉到这种居高临下，之前的好都变味了，很难再接受',
    b:'只要对方不是故意的，这种感觉我可以消化，不影响关系大局' },

  // 不可选 (Explore/Anchor)
  { dim:'explore', label:'不可选',
    text:'你被分配到一个不是你选的但很重要的任务/岗位/方向。你的内在反应更接近哪个？',

const DIM_NAMES = { drive:'驱', compose:'泰', fierce:'烈', tolerant:'容', explore:'拓', anchor:'专', roam:'游', base:'栖' };

const TYPES = {
  'DTAB': {
    zh:'驱容专栖', en:'Drive · Tolerant · Anchor · Base',
    tagline:'往前冲，能忍，不挑路，扎得住。',
    dims:[
      {char:'驱', text:'求不得（高）：你的内在驱动力极强，目标受阻时会感到强烈的痛苦'},
      {char:'容', text:'不可忍（低）：你对基础层的侵蚀相对迟钝，能忍别人忍不了的'},
      {char:'专', text:'不可选（低）：你不太介意方向是谁定的，给你一条路就能冲'},
      {char:'栖', text:'不可逃（低）：你不焦虑退出通道，扎在一个地方很自然'},
    ],
    pattern:`你永远有下一个目标，永远在往前走。"我很忙但很充实"是你最常说的话。你不太挑环境——给你一个方向你就能投入，给你一个位置你就能扎下来。你身边的人觉得你是"能扛事的人"。\n\n但你的"能扛"有一个隐藏成本：你的基础层报警系统是静音的。被工具化对待的时候你的反应是"忍一忍"，方向被限制的时候你的反应是"没关系"，退出通道被封堵的时候你的反应是"我在这里挺好的"。`,
    pitfall:`你最危险的处境不是失败——失败至少逼你停下来检查。你最危险的处境是"有意义的忙碌"。当工作有意义、目标在推进、成就在积累的时候，你的涌现层被喂得很饱，其他三个报警系统同时静音。你可以在一份"有意义的工作"中被系统性地透支十年而不自知。\n\n等你终于感受到痛苦的时候——因为长期积累的损害穿透了你的高阈值——爆发会极其猛烈。你会发现自己已经不知道"我是谁"了，只知道"我在做什么"。`,
    misunderstood:['「他很坚强」→ 不是坚强，是基础层报警系统静音了','「他很专注」→ 不是专注，是方向自由感被钝化了','「他很忠诚」→ 不是忠诚，是退出焦虑被钝化了'],
    works_not:'「放松一下」「别那么拼」——这些话在涌现层里打转，根本碰不到你的基础层。你听了会说"好的"然后继续冲。',
    works:'用你听得懂的语言翻译你听不到的信号。不是「你应该照顾自己」，而是「你继续这样下去，三年后你连冲的能力都没有了」。把基础层的需求翻译成涌现层的语言——这是唯一能穿透你感知屏障的方式。'
  },

  'CTAB': {

    tagline:'什么都行，哪儿都好。',
    dims:[

      {char:'容', text:'不可忍（低）：你对基础层的侵蚀相对迟钝，能扛'},
      {char:'专', text:'不可选（低）：你不太介意方向是谁定的'},
      {char:'栖', text:'不可逃（低）：你不焦虑退出通道'},
    ],
    pattern:`你给人的印象是随和、好相处、不折腾。你不急着赶路，不太计较方向，不焦虑退出，也不容易被基础层的侵蚀触发。你最常说的话可能是"都行""我没意见"。\n\n但这里有一个需要你自己诚实面对的问题：你的"都行"是因为你天性从容，还是因为你的四个报警系统都被长期校准到了静音？`,
    pitfall:`如果你是天性从容型——你确实挺好的。你的风险是涌现层可能终身蛰伏，从来不问自己"我想要什么"。\n\n如果你是全面钝化型——你最大的风险是你不知道你有问题。所有报警系统同时静音，你在结构上可能已经被深度透支但主观上感觉"一切正常"。\n\n区分方法：问自己"我有没有过强烈的痛苦体验——目标受挫的痛、尊严被踩的痛、被困住的痛？"如果能回忆起来（只是不频繁），你可能是天性从容。如果连"那是什么感觉"都描述不出来，你可能需要认真想想。`,
    misunderstood:['「他很好说话」→ 可能是好说话，也可能是报警系统静音了','「他很随和」→ 可能是真随和，也可能是从来没被催化过','「他没什么追求」→ 可能是不需要，也可能是不知道自己可以需要'],

  },

  'DFAB': {
    zh:'驱烈专栖', en:'Drive · Fierce · Anchor · Base',
    tagline:'有驱动力也有底线，专注且扎实。',

    pattern:`你是别人眼中"靠谱的人"。有驱动力又有底线，给你一个方向你就能冲，但不会为了目标践踏自己的原则。这种组合在任何环境中都被高度评价。\n\n但你的结构里藏着一个裂缝：驱和烈可能打架。当目标要求你越过底线时——"要完成这个项目需要做一些我觉得不对的事"——你内部会撕裂。驱说"必须完成"，烈说"不能越线"。`,
    pitfall:`忠诚陷阱。你对一个组织或关系高度忠诚（专+栖），同时你有底线（烈），但组织或关系逐渐偏移到你的底线之外。你不想走，也不觉得需要换路，但驱和烈的撕裂越来越频繁。最终要么底线让步，要么某天突然爆发"我不干了"——所有人都震惊。`,

  },

  'CFAB': {
    zh:'泰烈专栖', en:'Composed · Fierce · Anchor · Base',
    tagline:'不急但底线硬，给定一条路就安稳守住。',

    pitfall:`不是某一个维度崩溃，而是四线作战导致的全面疲劳。四个报警系统同时在响，注意力被持续分散，没有一个维度获得充分处理时间。结果是所有维度都在"轻度报警"，没有一个崩溃但全都不舒服——一种慢性的、弥漫性的疲劳。\n\n你的另一个风险是找不到能同时满足四种需求的环境。大多数环境满足一两种就不错了。`,

    pitfall:`"自由地透支"。方向是你自己选的，目标在推进，所以你主观上完全觉得没问题。但你可能在一个"自己选择的事业"中持续自我工具化而不自知。"这是我自己选的"成了最强的防御叙事。`,

// ── STATE ──────────────────────────────────────────────────────────────────
let cur = 0;
let answers = new Array(16).fill(null);
let fromType = null;

// ── INIT ───────────────────────────────────────────────────────────────────
(function init() {
  const params = new URLSearchParams(window.location.search);
  const from = params.get('from');
  const result = params.get('result');
  if (from && TYPES[from]) {
    fromType = from;
    const banner = document.getElementById('invite-banner');
    banner.style.display = 'block';
    banner.innerHTML = `有人邀请你来测 HC-16。<br>他们的类型是 <strong>${from} · ${TYPES[from].zh}</strong>——<br>完成测试后你们会看到关系分析。`;
  }
  if (result && TYPES[result]) {
    showResult(result);
  }
})();

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startTest() {
  cur = 0;
  answers = new Array(16).fill(null);
  renderQuestion();
  show('s-test');
}

function retake() {
  startTest();
}

// ── QUESTION RENDERING ─────────────────────────────────────────────────────
const DIM_LABELS = { drive:'求不得', fierce:'不可忍', explore:'不可选', roam:'不可逃' };

function renderQuestion() {
  const q = Q[cur];
  const pct = (cur / 16) * 100;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('p-dim').textContent = DIM_LABELS[q.dim];
  document.getElementById('p-num').textContent = `第 ${cur + 1} / 16 题`;
  document.getElementById('q-dim-label').textContent = DIM_LABELS[q.dim];
  document.getElementById('q-text').textContent = q.text;

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  [['A', q.a], ['B', q.b]].forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    if (answers[cur] === letter) btn.classList.add('selected');
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span class="opt-text">${text}</span>`;
    btn.onclick = () => selectAnswer(letter);
    opts.appendChild(btn);
  });
}

function selectAnswer(letter) {
  answers[cur] = letter;
  // visual feedback
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  const idx = letter === 'A' ? 0 : 1;
  document.querySelectorAll('.opt-btn')[idx].classList.add('selected');
  // auto advance after brief delay
  setTimeout(() => {
    cur++;
    if (cur < 16) {
      renderQuestion();
    } else {
      calcResult();
    }
  }, 280);
}

// ── SCORING ────────────────────────────────────────────────────────────────
function calcResult() {
  // each dim: Q1-4=drive, Q5-8=fierce, Q9-12=explore, Q13-16=roam
  const slices = [answers.slice(0,4), answers.slice(4,8), answers.slice(8,12), answers.slice(12,16)];
  const scores = slices.map(s => s.filter(a => a === 'A').length);
  // 3-4 = High, 0-2 = Low (Method B for boundary)
  const high = scores.map(s => s >= 3);
  const code = [
    high[0] ? 'D' : 'C',
    high[1] ? 'F' : 'T',
    high[2] ? 'E' : 'A',
    high[3] ? 'R' : 'B'
  ].join('');
  showResult(code);
}

// ── RESULT RENDERING ────────────────────────────────────────────────────────
function showResult(code) {
  const t = TYPES[code];
  if (!t) { showResult('DTAB'); return; }

  document.getElementById('r-code').textContent = code;
  document.getElementById('r-zh').textContent = t.zh;
  document.getElementById('r-en').textContent = t.en;
  document.getElementById('r-tagline').textContent = t.tagline;

  // dims
  const dimsEl = document.getElementById('r-dims');
  dimsEl.innerHTML = t.dims.map(d =>
    `<div class="dim-row"><div class="dim-char">${d.char}</div><div class="dim-text">${d.text}</div></div>`
  ).join('');

  // pattern
  document.getElementById('r-pattern').innerHTML =
    t.pattern.split('\n\n').map(p => `<p class="result-para">${p}</p>`).join('');

  // pitfall
  document.getElementById('r-pitfall').innerHTML =
    t.pitfall.split('\n\n').map(p => `<p class="result-para">${p}</p>`).join('');

  // misunderstood
  document.getElementById('r-misunderstood').innerHTML =
    t.misunderstood.map(m => `<div class="misunderstood-item">${m}</div>`).join('');

  // works
  document.getElementById('r-works').innerHTML = `
    <div class="works-block">
      <div class="works-label">没用的</div>
      <div class="works-text">${t.works_not}</div>
    </div>
    <div class="works-block">
      <div class="works-label">有效的</div>
      <div class="works-text">${t.works}</div>
    </div>`;

  // compatibility
  const compatEl = document.getElementById('r-compat');
  if (fromType && TYPES[fromType] && fromType !== code) {
    compatEl.innerHTML = renderCompat(fromType, code);
  } else {
    compatEl.innerHTML = '';
  }

  // update invite button
  document.getElementById('btn-invite').textContent = `拉一个人来测，看你们之间的关系 →`;

  // store current result for sharing
  window._myType = code;

  show('s-result');
}

// ── COMPATIBILITY ──────────────────────────────────────────────────────────
const DIM_KEYS = ['drive','fierce','explore','roam'];
const DIM_ZH = ['求不得','不可忍','不可选','不可逃'];
const DIM_CHARS_HIGH = ['驱','烈','拓','游'];
const DIM_CHARS_LOW  = ['泰','容','专','栖'];

function typeIsHigh(code, dim) {
  const pos = { drive:0, fierce:1, explore:2, roam:3 };
  const highChars = ['D','F','E','R'];
  return code[pos[dim]] === highChars[pos[dim]];
}

function renderCompat(t1, t2) {
  const complement = [], friction = [], blindspot = [];
  DIM_KEYS.forEach((dim, i) => {
    const h1 = typeIsHigh(t1, dim);
    const h2 = typeIsHigh(t2, dim);
    if (h1 && h2) friction.push(i);
    else if (!h1 && !h2) blindspot.push(i);
    else complement.push(i);
  });

  const chipHtml = (arr, cls) => arr.map(i =>
    `<span class="compat-chip ${cls}">${DIM_ZH[i]}</span>`).join('');

  return `
  <div class="compat-section">
    <div class="compat-header">
      <div>
        <div style="font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,240,232,0.25);margin-bottom:0.5rem;">关系分析</div>
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
          <span class="compat-type-chip">${t1}</span>
          <span class="compat-zh">${TYPES[t1].zh}</span>
          <span class="compat-x">×</span>
          <span class="compat-type-chip me">${t2}</span>
          <span class="compat-zh">${TYPES[t2].zh}</span>
        </div>
      </div>
    </div>
    <div class="compat-grid">
      ${complement.length ? `
      <div class="compat-row">
        <div class="compat-row-label">互补维度</div>
        <div class="compat-row-text">一方的高敏感覆盖另一方的盲区，形成跨维度保护。</div>
        <div class="compat-chips">${chipHtml(complement,'green')}</div>
      </div>` : ''}
      ${friction.length ? `
      <div class="compat-row">
        <div class="compat-row-label">可能的摩擦点</div>
        <div class="compat-row-text">双方在这些维度上都高度敏感，彼此的反应可能相互触发。</div>
        <div class="compat-chips">${chipHtml(friction,'amber')}</div>
      </div>` : ''}
      ${blindspot.length ? `
      <div class="compat-row">
        <div class="compat-row-label">共同盲区</div>
        <div class="compat-row-text">双方在这些维度上都低敏感——没有人会为对方在这里预警。</div>
        <div class="compat-chips">${chipHtml(blindspot,'red')}</div>
      </div>` : ''}
    </div>
  </div>`;
}

// ── SHARING ────────────────────────────────────────────────────────────────
function shareInvite() {
  const code = window._myType || 'DTAB';
  const url = `https://nondubito.net/hc16.html?from=${code}`;
  const text = `我测了 HC-16，是 ${code} · ${TYPES[code].zh}。来测你的类型，看看我们之间的关系——`;
  if (navigator.share) {
    navigator.share({ title: 'HC-16 脆弱性图谱', text, url });
  } else {
    copyToClipboard(url, '邀请链接已复制 →');
  }
}

function shareResult() {
  const code = window._myType || 'DTAB';
  const t = TYPES[code];
  const text = `HC-16 测试结果：${code} · ${t.zh}\n"${t.tagline}"\n测你的：https://nondubito.net/hc16.html`;
  if (navigator.share) {
    navigator.share({ title: `HC-16: ${code} · ${t.zh}`, text, url: `https://nondubito.net/hc16.html?result=${code}` });
  } else {
    copyToClipboard(text, '结果已复制到剪贴板');
  }
}

function copyToClipboard(text, msg) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast(msg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(msg);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
