<style>
:root {
  --ink: #0f0f0e;
  --ink2: #1a1a18;
  --cream: #f5f0e8;
  --cream2: #ede8e0;
  --green: #2d4a3e;
  --gold: #b8953a;
  --gold-light: #d4a843;
  --sans: 'Inter', sans-serif;
  --serif: 'EB Garamond', Georgia, serif;

  --radius: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--sans);
  background: var(--ink);

}

/* ── HEADER ── */
.hdr {

  background: rgba(15,15,14,0.92);

  border-bottom: 1px solid rgba(245,240,232,0.07);
  display: flex; align-items: center;
  padding: 0 1.5rem;

}
.hdr-logo { font-family: var(--serif); font-size: 0.95rem; color: var(--cream); text-decoration: none; opacity: 0.7; }
.hdr-tag { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,240,232,0.3); }

.hdr-right { display: flex; align-items: center; gap: 1.5rem; }
.lang-toggle { display: flex; align-items: center; gap: 0.5rem; background: none !important; border: none !important; padding: 0 !important; }
.lang-btn { background: none !important; border: none; color: rgba(245,240,232,0.4); font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: color 0.2s; padding: 0.15rem 0.3rem; }
.lang-btn.active { color: var(--cream) !important; font-weight: 500; }

.lang-sep { color: rgba(245,240,232,0.2); font-size: 0.75rem; }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; padding-top: 50px; }
.screen.active { display: block; }

/* ── INTRO ── */
#s-intro {

}
.intro-eyebrow {

}

}
.intro-desc {

}
.intro-invite-banner {

/* ── TEST SCREEN ── */

}

  font-size: clamp(1rem, 2.5vw, 1.2rem);
  line-height: 1.85;

  margin-bottom: 2.5rem;
  min-height: 5rem;
}

.options { display: flex; flex-direction: column; gap: 1rem; }
.opt-btn {

  border-color: rgba(184,149,58,0.4);
}
.opt-letter {
  font-family: var(--serif);
  font-size: 0.8rem;
  color: rgba(245,240,232,0.3);
  min-width: 1.2rem;
  padding-top: 0.1rem;
  font-style: italic;
}
.opt-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.95rem;
  line-height: 1.75;
  color: rgba(245,240,232,0.8);
}

/* ── RESULT SCREEN ── */
#s-result { padding: 50px 0 0; }
.result-hero {

.result-eyebrow {

.result-tagline {

.result-section { margin-bottom: 3rem; }

}
.result-dims { display: flex; flex-direction: column; gap: 0.8rem; }
.dim-row {

}
.dim-char {

  font-size: 1.3rem;

}
.dim-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
}
.result-para {
  font-family: var(--cjk), var(--serif);
  font-size: 0.95rem; line-height: 1.9;

  margin-bottom: 1rem;
}
.result-misunderstood { display: flex; flex-direction: column; gap: 0.8rem; }
.misunderstood-item {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
  padding-left: 1rem;
  border-left: 2px solid rgba(245,240,232,0.1);
}
.result-works { display: flex; flex-direction: column; gap: 1rem; }
.works-block { }
.works-label {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); margin-bottom: 0.4rem;
}
.works-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.92rem; line-height: 1.8;
  color: rgba(245,240,232,0.7);
}

/* ── COMPATIBILITY SECTION ── */
.compat-section {
  background: rgba(245,240,232,0.03);
  border: 1px solid rgba(245,240,232,0.07);
  border-radius: var(--radius);
  padding: 2rem 1.5rem;
  margin-bottom: 2rem;
}
.compat-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; flex-wrap: wrap;
}
.compat-type-chip {
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: 4px;
  padding: 0.4rem 0.8rem;
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--cream);

.compat-zh {
  font-family: var(--cjk), serif;
  font-size: 0.8rem;

}

.compat-grid { display: flex; flex-direction: column; gap: 1rem; }
.compat-row { }
.compat-row-label {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(245,240,232,0.25); margin-bottom: 0.4rem;
}
.compat-row-text {
  font-family: var(--cjk), var(--serif);
  font-size: 0.9rem; line-height: 1.75;
  color: rgba(245,240,232,0.7);
}
.compat-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
.compat-chip {
  font-family: var(--cjk), serif;
  font-size: 0.75rem;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  border: 1px solid;
}
.compat-chip.green { color: rgba(150,200,150,0.8); border-color: rgba(150,200,150,0.3); background: rgba(150,200,150,0.06); }
.compat-chip.amber { color: rgba(220,160,80,0.8); border-color: rgba(220,160,80,0.3); background: rgba(220,160,80,0.06); }
.compat-chip.red { color: rgba(200,100,100,0.8); border-color: rgba(200,100,100,0.3); background: rgba(200,100,100,0.06); }

/* ── CTA ── */
.cta-area {
  text-align: center;
  padding: 0 1.5rem 4rem;
  max-width: var(--max-w);
  margin: 0 auto;
}
.btn-invite {
  display: block; width: 100%;
  background: var(--cream);
  color: var(--ink);
  border: none; border-radius: var(--radius);
  font-family: var(--cjk), var(--sans);
  font-size: 0.95rem;
  font-weight: 500;

  margin-bottom: 0.8rem;
  transition: background 0.15s;
}
.btn-invite:hover { background: var(--cream2); }
.btn-share {
  display: block; width: 100%;

  color: rgba(245,240,232,0.5);

  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 0.8rem;
  letter-spacing: 0.06em;

}
.btn-share:hover { border-color: rgba(245,240,232,0.3); color: rgba(245,240,232,0.7); }
.btn-retake {
  display: block; width: 100%;
  background: transparent;
  color: rgba(245,240,232,0.25);

  font-family: var(--sans);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 0.5rem;

  margin-bottom: 2rem;

.btn-retake:hover { color: rgba(245,240,232,0.45); }
.cta-back {
  display: block;
  font-family: var(--sans);
  font-size: 0.62rem;

  text-transform: uppercase;
  color: rgba(245,240,232,0.18);
  text-decoration: none;
  transition: color 0.2s;
  margin-top: 1rem;
}
.cta-back:hover { color: rgba(245,240,232,0.35); }

.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: var(--ink2);
  border: 1px solid rgba(245,240,232,0.12);
  border-radius: var(--radius);

.toast.show { opacity: 1; }

@media (max-width: 400px) {
  .result-code { letter-spacing: 0.12em; }
}
</style>
</head>

const TYPES = {

      'Base (Low): No exit anxiety — settling into a place feels natural'
    ],
    pattern:`你永远有下一个目标，永远在往前走。"我很忙但很充实"是你最常说的话。你不太挑环境——给你一个方向你就能投入，给你一个位置你就能扎下来。你身边的人觉得你是"能扛事的人"。\n\n但你的"能扛"有一个隐藏成本：你的基础层报警系统是静音的。被工具化对待的时候你的反应是"忍一忍"，方向被限制的时候你的反应是"没关系"，退出通道被封堵的时候你的反应是"我在这里挺好的"。`,
    pattern_en:`You always have a next goal, always moving forward. 'I'm busy but fulfilled' is your most common refrain. You don't need to choose your environment — give you a direction and you commit, give you a position and you root. People around you think of you as 'the one who can handle things.'\n\nBut your 'can take it' has a hidden cost: your foundational alarm systems are on mute. When instrumentalized, your response is 'I'll manage.' Direction gets restricted: 'it's fine.' Exit gets sealed: 'I'm good here.'`,
    pitfall:`你最危险的处境不是失败——失败至少逼你停下来检查。你最危险的处境是"有意义的忙碌"。当工作有意义、目标在推进、成就在积累的时候，你的涌现层被喂得很饱，其他三个报警系统同时静音。你可以在一份"有意义的工作"中被系统性地透支十年而不自知。\n\n等你终于感受到痛苦的时候——因为长期积累的损害穿透了你的高阈值——爆发会极其猛烈。你会发现自己已经不知道"我是谁"了，只知道"我在做什么"。`,
    pitfall_en:`Your most dangerous state isn't failure — failure at least forces you to stop and check. It's 'meaningful busyness.' When work is meaningful, goals advancing, achievements accumulating — your drive layer is fully fed, and all three other alarm systems simultaneously mute. You can be systematically depleted for a decade inside 'meaningful work' without knowing it.\n\nWhen you finally feel pain — long-accumulated damage breaching your high threshold — the explosion will be extreme. You'll find you no longer know 'who I am,' only 'what I do.'`,
    misunderstood:['「他很坚强」→ 不是坚强，是基础层报警系统静音了','「他很专注」→ 不是专注，是方向自由感被钝化了','「他很忠诚」→ 不是忠诚，是退出焦虑被钝化了'],
    misunderstood_en:['\'He\'s so resilient\' → Not resilience — foundational alarm systems are muted','\'He\'s so focused\' → Not focus — his sense of directional freedom has been dulled','\'He\'s so loyal\' → Not loyalty — exit anxiety has been numbed'],
    works_not:'「放松一下」「别那么拼」——这些话在涌现层里打转，根本碰不到你的基础层。你听了会说"好的"然后继续冲。',
    works_not_en:'\'Relax a little\' / \'don\'t work so hard\' — these orbit in the drive layer, never touching the foundation. You\'ll say \'okay\' and keep running.',
    works:'用你听得懂的语言翻译你听不到的信号。不是「你应该照顾自己」，而是「你继续这样下去，三年后你连冲的能力都没有了」。把基础层的需求翻译成涌现层的语言——这是唯一能穿透你感知屏障的方式。',
    works_en:'Translate the signals you can\'t hear into language you can. Not \'you should take care of yourself\' but \'if you keep this up, in three years you won\'t even have the capacity to run.\' Convert foundational needs into drive-layer language — that\'s the only way through your perceptual barrier.'

    pattern:`你给人的印象是随和、好相处、不折腾。你不急着赶路，不太计较方向，不焦虑退出，也不容易被基础层的侵蚀触发。你最常说的话可能是"都行""我没意见"。\n\n但这里有一个需要你自己诚实面对的问题：你的"都行"是因为你天性从容，还是因为你的四个报警系统都被长期校准到了静音？`,
    pattern_en:`You come across as easy-going, approachable, low-drama. Not rushing anywhere, don't care much about direction, no exit anxiety. 'Whatever' and 'I'm fine with anything' might be your signature phrases.\n\nBut there's a question you need to honestly face: Is your 'whatever' because you're genuinely easygoing — or because all four alarm systems have been calibrated to mute over time?`,
    pitfall:`如果你是天性从容型——你确实挺好的。你的风险是涌现层可能终身蛰伏，从来不问自己"我想要什么"。\n\n如果你是全面钝化型——你最大的风险是你不知道你有问题。所有报警系统同时静音，你在结构上可能已经被深度透支但主观上感觉"一切正常"。\n\n区分方法：问自己"我有没有过强烈的痛苦体验——目标受挫的痛、尊严被踩的痛、被困住的痛？"如果能回忆起来（只是不频繁），你可能是天性从容。如果连"那是什么感觉"都描述不出来，你可能需要认真想想。`,
    pitfall_en:`If you're naturally composed — you're genuinely okay. Your risk: the drive layer may remain dormant lifelong, never asking 'what do I actually want.'\n\nIf you're fully-numbed — your biggest risk is not knowing you have a problem. All systems muted, you might be structurally deeply depleted while subjectively feeling 'everything is normal.'\n\nDistinguishing test: 'Have I ever had intense pain — blocked goals, violated dignity, being trapped?' If you can recall (just infrequently), you may be naturally composed. If you can't even describe what those feel like, you may need to think seriously.`,

    pattern_en:`You're the person others call 'reliable.' Driven and principled — give you a direction and you'll run it, but you won't cross your own principles for the goal. This combination is valued in any environment.\n\nBut there's a fault line in your structure: Drive and Dignity can conflict. When a goal requires crossing a line — 'completing this project means doing something I think is wrong' — you tear internally. Drive says 'must finish,' Dignity says 'can't cross the line.'`,
    pitfall:`忠诚陷阱。你对一个组织或关系高度忠诚（专+栖），同时你有底线（烈），但组织或关系逐渐偏移到你的底线之外。你不想走，也不觉得需要换路，但驱和烈的撕裂越来越频繁。最终要么底线让步，要么某天突然爆发"我不干了"——所有人都震惊。`,
    pitfall_en:`The loyalty trap. You're deeply loyal to an organization or relationship (Anchor + Base), you have hard limits (Fierce), but the organization gradually drifts past your limits. You don't want to leave and don't feel you need to change course, but the Drive-Dignity conflict intensifies. Eventually either the limits give way, or one day you explode 'I'm done' — and everyone is shocked.`,
    misunderstood:['「他很稳定」→ 稳定外表下可能是驱与烈的持续内战','「他没什么不满」→ 不是没有不满，是在底线被触及之前确实没有'],
    misunderstood_en:['\'He\'s so stable\' → A stable exterior may be the ongoing internal war between Drive and Dignity','\'He has no complaints\' → Not \'no complaints\' — just hasn\'t been triggered until the line is crossed'],
    works_not:'「放松」或「勇敢一点」。',
    works_not_en:'\'Relax\' or \'be braver.\'',
    works:'提前识别驱烈冲突的环境。在撕裂发生之前就看到"这个方向迟早逼我越线"，然后在还有余地的时候调整。你的修复是预防性的——一旦撕裂发生，修复成本极高。',
    works_en:'Identify Drive-Dignity conflict environments in advance. See \'this direction will eventually force me across the line\' before the tearing happens, and adjust while there\'s still room. Your repair is preventive — once the tearing happens, the cost is extremely high.'
  },
  'CFAB': {
    zh:'泰烈专栖', en:'Composed · Fierce · Anchor · Base',
    tagline:'不急但底线硬，给定一条路就安稳守住。', tagline_en:'Unhurried but hard-lined. Steady in a given path.',
    dims:[
      {char:'泰', text:'求不得（低）：涌现层安静，不急'},
      {char:'烈', text:'不可忍（高）：底线极硬'},
      {char:'专', text:'不可选（低）：不挑方向'},
      {char:'栖', text:'不可逃（低）：扎得住'},
    ],
    dims_en:[
      'Composed (Low): Quiet drive layer, unhurried',
      'Fierce (High): Hard limits',
      'Anchor (Low): Fine with a given direction',
      'Base (Low): Settled'
    ],
    pattern:`你的核心关切不是"我要成为什么"，而是"我是否被当作一个人来对待"。你不急着赶路，不挑方向，扎得住——但你有一条极其清晰的底线。被工具化对待、被不当人看的时候，反应迅速且坚决。\n\n你经常是别人的"港湾"——你给人的感觉是"跟他在一起很安全"。不会突然要走，不会催你赶路，不会用你。`,
    pattern_en:`Your core concern isn't 'what do I want to become' — it's 'am I being treated as a person.' You're not rushing, you don't demand to choose your direction, you settle well — but you have an extremely clear line. When instrumentalized or disrespected, your response is swift and decisive.\n\nYou're often others' 'safe harbor.' Being with you feels safe — you won't suddenly leave, you won't rush them, you won't use them.`,
    pitfall:`涌现层的终身蛰伏。你的三个低敏感维度构成了一个极其厚实的惰性层，涌现层的任何萌动都被"不需要"的叙事吸收了。你可能一生都在守护一个位置而从未问过"我自己想要什么"。`,
    pitfall_en:`Lifelong dormancy of the drive layer. Three low-sensitivity dimensions create an extremely thick inertia layer, absorbing any stirring of drive into a 'don't need it' narrative. You might spend your whole life guarding a position without ever asking 'what do I myself want.'`,
    misunderstood:['「他没什么追求」→ 不是没有涌现层，是涌现层从未被催化','「他很随和」→ 碰了底线就知道他一点都不随和'],
    misunderstood_en:['\'He has no ambitions\' → Not no drive — it was never catalyzed','\'He\'s so easygoing\' → Touch the line and you\'ll see he\'s not easygoing at all'],
    works_not:'「你应该有自己的追求」——涌现层的重型语言对你不管用。',
    works_not_en:'\'You should have your own pursuits\' — heavy drive-layer language doesn\'t work on you.',
    works:'在基础层完全安全的前提下，用好奇心微小催化涌现层。"你有没有好奇过，如果你试试X会怎样？"关键词是"好奇"不是"应该"。',
    works_en:'In a fully safe foundation, use curiosity to gently catalyze the drive layer. \'Have you ever wondered what would happen if you tried X?\' Key word: \'curious,\' not \'should.\''
  },
  'DFER': {
    zh:'驱烈拓游', en:'Drive · Fierce · Explore · Roam',
    tagline:'四个频道全开，什么信号都收。', tagline_en:'All four channels open. Receives every signal.',
    dims:[
      {char:'驱', text:'求不得（高）：内在驱动力极强'},
      {char:'烈', text:'不可忍（高）：底线极硬'},
      {char:'拓', text:'不可选（高）：方向自由是核心需求'},
      {char:'游', text:'不可逃（高）：对被困住极度警觉'},
    ],
    dims_en:[
      'Drive (High): Intense internal drive',
      'Fierce (High): Hard limits',
      'Autonomy (High): Directional freedom is a core need',
      'Exit (High): Extremely alert to being trapped'
    ],
    pattern:`你同时在四条线上运转——有强烈的驱动力要往前冲，有敏锐的底线意识随时监测，需要方向空间保持开放，还需要确认退出通道没被封堵。四种需求同时在线，任何一种不被满足都会触发明显的痛苦。\n\n别人说你"太强烈了""活得太用力"。但从你的视角看，你不是用力活，你只是什么都能感知到——四个维度的信号同时接收，不可能假装某个不存在。`,
    pattern_en:`You're running on all four channels simultaneously — intense drive pushing forward, sharp boundary awareness monitoring constantly, need for directional space to stay open, and checking that exit channels aren't sealed. Any one need unsatisfied triggers clear pain.\n\nPeople say you're 'too intense' or 'living too hard.' From your view, you're not living hard — you just perceive everything. Four dimensions of signals received simultaneously; you can't pretend any doesn't exist.`,
    pitfall:`不是某一个维度崩溃，而是四线作战导致的全面疲劳。四个报警系统同时在响，注意力被持续分散，没有一个维度获得充分处理时间。结果是所有维度都在"轻度报警"，没有一个崩溃但全都不舒服——一种慢性的、弥漫性的疲劳。\n\n你的另一个风险是找不到能同时满足四种需求的环境。大多数环境满足一两种就不错了。`,
    pitfall_en:`Not one dimension collapsing, but comprehensive fatigue from fighting on four fronts. All four alarm systems running simultaneously, attention continuously split, no dimension gets adequate processing time. Result: all in 'mild alert' — none collapsed but all uncomfortable. A chronic, diffuse exhaustion.\n\nYour other risk: not finding an environment that satisfies all four needs at once. Most environments do well to satisfy one or two.`,
    misunderstood:['「他太挑剔了」→ 不是挑剔，是四个报警系统都在工作','「他永远不满足」→ 不是不满足，是四个维度的需求同时在线','「他为什么这么累」→ 因为四个频道全开，24小时不关机'],
    misunderstood_en:['\'He\'s too demanding\' → Not demanding — all four alarm systems are working','\'He\'s never satisfied\' → Not unsatisfied — four needs online simultaneously','\'Why is he so exhausted\' → Four channels open 24/7, never off'],
    works_not:'「降低你的标准」「别想那么多」——这是让你变成另一种类型。',
    works_not_en:'\'Lower your standards\' / \'don\'t think so much\' — this asks you to become a different type.',
    works:'维度间的时序管理。不是四线同时作战，而是在不同时间段聚焦不同维度。"这个月聚焦涌现层推进，基础层监测调到后台。"管理带宽比降低敏感度更有效。',
    works_en:'Temporal sequencing between dimensions. Not four-front simultaneous combat, but focusing on different dimensions at different times. \'This month focus on drive advancement, set boundary monitoring to background.\' Managing bandwidth is more effective than lowering sensitivity.'
  },
  'DTEB': {
    zh:'驱容拓栖', en:'Drive · Tolerant · Explore · Base',
    tagline:'驱动力强，要方向自由，扎得住——基础层报警系统偏弱。', tagline_en:'Strong drive, needs directional freedom, can settle — foundation alarms are off.',
    dims:[
      {char:'驱', text:'求不得（高）：内在驱动力强'},
      {char:'容', text:'不可忍（低）：基础层侵蚀能扛'},
      {char:'拓', text:'不可选（高）：方向自由是核心需求'},
      {char:'栖', text:'不可逃（低）：扎得住'},
    ],
    dims_en:[
      'Drive (High): Strong internal drive',
      'Tolerant (Low): Can absorb foundational violations',
      'Autonomy (High): Directional freedom is core',
      'Base (Low): Settled'
    ],
    pattern:`你的全部能量都在涌现层——强烈的驱动力加上对方向自由的渴望。你不会"给条路就冲"（那是DTAB），你需要自己选方向。同时你能扎得住，不会漂。\n\n但你的基础层两个报警系统都静音——被工具化了能忍，退出通道被封了不焦虑。`,
    pattern_en:`All your energy is in the drive layer — intense drive plus hunger for directional freedom. You won't 'run any path given to you' (that's DTAB) — you need to choose your own direction. You can also settle in, you don't drift.\n\nBut your foundational alarm systems are both muted — being instrumentalized is tolerable, exit channels being sealed doesn't cause anxiety.`,
    pitfall:`"自由地透支"。方向是你自己选的，目标在推进，所以你主观上完全觉得没问题。但你可能在一个"自己选择的事业"中持续自我工具化而不自知。"这是我自己选的"成了最强的防御叙事。`,
    pitfall_en:`'Freely depleting yourself.' The direction is self-chosen, goals are advancing — subjectively you feel completely fine. But you might be continuously self-instrumentalizing within 'the career I chose' without knowing it. 'I chose this' becomes the strongest defensive narrative.`,
    misunderstood:['「他很有主见」→ 有主见没错，但基础层保护是缺失的','「他不需要人照顾」→ 这是他告诉自己的故事，不一定是真的'],
    misunderstood_en:['\'He has a strong sense of self\' → True, but foundational protection is missing','\'He doesn\'t need looking after\' → That\'s the story he tells himself — not necessarily true'],
    works_not:'任何绕开"方向选择权"的建议。',
    works_not_en:'Any advice that bypasses the right to choose direction.',
    works:'你需要一个基础层敏感度高的人在身边——当你的"这是我选的"叙事阻止你看到基础层侵蚀时，他们的一句"你知道你正在被当工具用吗"可能是唯一穿透屏障的信号。',
    works_en:'You need someone with high foundational sensitivity nearby — when your \'I chose this\' narrative is blocking you from seeing foundational erosion, their \'do you realize you\'re being instrumentalized?\' might be the only signal that can breach your barrier.'
  },
  'CFAR': {
    zh:'泰烈专游', en:'Composed · Fierce · Anchor · Roam',
    tagline:'不急但底线硬，专注但不被绑——有原则的自由人。', tagline_en:'Unhurried but hard-lined. Focused but unbound — principled freedom.',
    dims:[
      {char:'泰', text:'求不得（低）：涌现层安静'},
      {char:'烈', text:'不可忍（高）：底线极硬'},
      {char:'专', text:'不可选（低）：能在一个方向上深入'},
      {char:'游', text:'不可逃（高）：对被困住极度警觉'},
    ],
    dims_en:[
      'Composed (Low): Quiet drive layer',
      'Fierce (High): Hard limits',
      'Anchor (Low): Can go deep in one direction',
      'Exit (High): Extremely alert to being trapped'
    ],
    pattern:`你的全部能量在基础层。底线极其清晰，同时对被困住极度警觉。涌现层相对安静——不急着冲，方向有限也不焦虑。\n\n你看起来淡泊，但碰了底线反应坚决。看起来安定，但试图绑住你就立刻拉开距离。你的自由不是"什么都要"的扩张型，而是"我需要的不能被动"的防御型。`,
    pattern_en:`All your energy is in the foundation. Extremely clear limits, and extremely alert to being trapped. Drive layer relatively quiet — not rushing, limited direction is fine.\n\nYou appear detached, but when the line is crossed you respond decisively. You appear stable, but try to bind you and you immediately create distance. Your freedom isn't expansionist 'I want everything' — it's defensive 'what I need cannot be taken.'`,
    pitfall:`基础层堡垒太坚固变成了封闭。"我不需要那些"可能不是真的不需要，是涌现层从未被催化。`,
    pitfall_en:`Foundational fortress too solid becomes closure. 'I don't need those things' might not be genuine — it might be that the drive layer was never catalyzed.`,
    misunderstood:['「他很淡泊」→ 不是真的不在乎，是在乎不同的东西','「他很容易相处」→ 直到碰了底线或者试图限制他'],
    misunderstood_en:['\'He\'s very detached\' → Not indifferent — cares about different things','\'He\'s easy to get along with\' → Until you touch his limits or try to restrict him'],
    works_not:'在基础层不安全时催化涌现层——这只会触发双重防御。',
    works_not_en:'Catalyzing the drive layer when the foundation isn\'t safe — this only triggers dual defense.',
    works:'在基础层完全安全的前提下，才能接收涌现层的信号。安全感必须先于催化。',
    works_en:'Only when the foundation is completely safe can drive-layer signals be received. Safety must precede catalysis.'
  },
  'DTAR': {
    zh:'驱容专游', en:'Drive · Tolerant · Anchor · Roam',
    tagline:'往前冲，能忍，能专注，但随时准备走。', tagline_en:'Runs hard, absorbs friction, stays focused — but always ready to leave.',
    dims:[
      {char:'驱', text:'求不得（高）：内在驱动力强'},
      {char:'容', text:'不可忍（低）：基础层侵蚀能扛'},
      {char:'专', text:'不可选（低）：能在一个方向上深入'},
      {char:'游', text:'不可逃（高）：对被困住极度警觉'},
    ],
    dims_en:[
      'Drive (High): Strong internal drive',
      'Tolerant (Low): Can absorb foundational erosion',
      'Anchor (Low): Can go deep in one direction',
      'Exit (High): Extremely alert to being trapped'
    ],
    pattern:`你能全力投入（驱+专），但你的投入不是因为"走不了"，而是因为"我选择留下"。一旦"选择留下"变成"不得不留下"，驱动力可能瞬间消失。\n\n你的典型轨迹：全力投入→做到某个阶段→感到"该走了"→干脆利落地离开→投入下一个。`,
    pattern_en:`You can commit fully (Drive + Anchor), but your commitment isn't because 'you can't leave' — it's because 'I choose to stay.' The moment 'choosing to stay' becomes 'forced to stay,' your drive can instantly vanish.\n\nYour typical pattern: full commitment → reach a certain stage → feel 'time to go' → clean departure → commit to the next thing.`,
    pitfall:`连续创业者综合征——每一段都在透支基础层（因为容让你忍），然后用离开来逃避修复（因为游让你走）。生命轨迹变成：投入→透支→离开→投入→透支→离开。`,
    pitfall_en:`Serial founder syndrome — each period depletes the foundation (Tolerant lets you absorb), then you use leaving to avoid repair (Roam lets you go). Life trajectory becomes: commit → deplete → leave → commit → deplete → leave.`,
    misunderstood:['「他很洒脱」→ 离开的代价他自己扛，外人看不见','「他很专注」→ 只到离开的那一刻为止'],
    misunderstood_en:['\'He\'s so free-spirited\' → The cost of leaving is his to carry — others don\'t see it','\'He\'s so dedicated\' → Until the moment he leaves'],
    works_not:'「你应该安定下来」——直接触发游的防御。',
    works_not_en:'\'You should settle down\' — directly triggers Exit defenses.',
    works:'不是要你安定，而是在每一段投入中加入基础层检查点。把游从逃跑机制升级为主动管理机制。',
    works_en:'Not asking you to settle, but adding foundational checkpoints in each period of commitment. Upgrading Exit from an escape mechanism to an active management tool.'
  },
  'DFEB': {
    zh:'驱烈拓栖', en:'Drive · Fierce · Explore · Base',
    tagline:'驱动力和底线都强，要方向自由但能安落——最完整的涌现型。', tagline_en:'Driven and principled, needs directional freedom, can settle — the most complete emergent type.',
    dims:[
      {char:'驱', text:'求不得（高）：内在驱动力强'},
      {char:'烈', text:'不可忍（高）：底线极硬'},
      {char:'拓', text:'不可选（高）：方向自由是核心需求'},
      {char:'栖', text:'不可逃（低）：能在一个地方深根'},
    ],
    dims_en:[
      'Drive (High): Strong internal drive',
      'Fierce (High): Hard limits',
      'Autonomy (High): Directional freedom is a core need',
      'Base (Low): Can root deeply in one place'
    ],
    pattern:`你是DFER去掉游的版本——不需要流动性，能在一个地方深入扎根，同时保持驱动力、底线和方向自由。三高一低，涌现层充分展开，基础层有烈的保护，栖提供稳定基地。这是最完整的涌现层主导型。\n\n你需要能同时满足"强烈推进""原则不被碰""我自己选方向"三种需求的环境，这样的环境不多，但一旦找到，你能发挥极致。`,
    pattern_en:`You're DFER minus the roaming — you don't need fluidity, you can put down deep roots while maintaining drive, principles, and directional freedom. Three high, one low — drive layer fully expanded, foundation protected by Dignity, Base provides stable ground.\n\nYou need an environment that simultaneously satisfies 'intense advancement,' 'principles aren't violated,' and 'I choose my direction.' These environments are rare — but once found, you can perform at your peak.`,
    pitfall:`栖的安稳慢慢吸收拓的能量——待久了，"探索新方向"从需求退化为念头。你可能在一个足够舒适的环境里，慢慢放弃了自己最核心的涌现层需求。`,
    pitfall_en:`Base's stability slowly absorbs Autonomy's energy — after a while, 'exploring new directions' degrades from a need to a passing thought. You might slowly abandon your most core drive-layer need inside an environment comfortable enough.`,
    misunderstood:['「他要求太高」→ 他需要三种条件同时满足，不是挑剔是结构需求','「他很稳定」→ 稳定是因为栖，但内部驱动从未停'],
    misunderstood_en:['\'He has high demands\' → He needs three conditions simultaneously — not picky, a structural need','\'He\'s so stable\' → Stable because of Base, but internal drive never stops'],
    works_not:'强迫在不满足方向自由时继续投入。',
    works_not_en:'Forcing continued commitment when directional freedom isn\'t met.',
    works:'定期审视：三个高敏感维度是否同时被满足？哪一个在萎缩？及早调整比等待崩溃有效得多。',
    works_en:'Regularly review: are all three high-sensitivity dimensions being simultaneously satisfied? Which one is atrophying? Early adjustment is far more effective than waiting for collapse.'
  },
  'DFAR': {
    zh:'驱烈专游', en:'Drive · Fierce · Anchor · Roam',
    tagline:'驱动力和底线都强，专注但保持流动——有根的漫游者。', tagline_en:'Driven and principled. Focused but in motion — a rooted wanderer.',
    dims:[
      {char:'驱', text:'求不得（高）：内在驱动力强'},
      {char:'烈', text:'不可忍（高）：底线极硬'},
      {char:'专', text:'不可选（低）：能在一个方向上深入'},
      {char:'游', text:'不可逃（高）：对被困住极度警觉'},
    ],
    dims_en:[
      'Drive (High): Strong internal drive',
      'Fierce (High): Hard limits',
      'Anchor (Low): Can go deep in one direction',
      'Exit (High): Extremely alert to being trapped'
    ],
    pattern:`跟DTAR的区别在于烈——你不能忍，底线被碰了就走。每一段停留中基础层得到更好的保护（烈在工作），但也可能因为底线被触及而更频繁地离开。\n\n你的轨迹不是"投入→透支→离开"，而是"投入→发现底线被碰→坚决离开"。人们觉得你难以预测——其实你的离开都有原因，只是他们没看见那条线。`,
    pattern_en:`The difference from DTAR is Dignity — you can't absorb violations; when the line is crossed you leave. Foundation gets better protection in each stay (Dignity is working), but you might leave more frequently.\n\nYour pattern isn't 'commit → deplete → leave' but 'commit → discover line crossed → decisive departure.' People find you unpredictable — actually your departures all have reasons; they just never saw the line.`,
    pitfall:`驱的推进需求和游的流动需求都很强，而烈让你在底线被触碰时快速离开。这个组合让你很难长期在任何一个地方累积影响力——因为每一次离开都有正当理由，但离开的频率本身会成为一种结构性的损耗。`,
    pitfall_en:`Drive's advancement need and Exit's mobility need are both intense, while Dignity makes you leave quickly when crossed. This combination makes it hard to build lasting influence anywhere — every departure has legitimate reason, but the frequency of departures itself becomes a structural drain.`,
    misunderstood:['「他很难相处」→ 不是难相处，是他的底线很清晰','「他不稳定」→ 不是不稳定，是不接受底线被触碰后继续待'],
    misunderstood_en:['\'He\'s difficult to work with\' → Not difficult — his limits are clear','\'He\'s unstable\' → Not unstable — unwilling to continue after limits are crossed'],
    works_not:'期待他为了"大局"忍受底线被碰。',
    works_not_en:'Expecting him to tolerate limits being crossed \'for the bigger picture.\'',
    works:'提前识别并明确说清楚你的底线在哪里。透明化你的边界，让环境有机会在触碰之前调整。',
    works_en:'Identify and clearly articulate your limits in advance. Make your boundaries transparent — give the environment a chance to adjust before touching them.'

// ── COMPATIBILITY & RENDERING ──────────────────────────────────────────────
const DIM_KEYS = ['drive','fierce','explore','roam'];
const DIM_ZH = ['求不得','不可忍','不可选','不可逃'];
const DIM_EN = ['Drive','Dignity','Autonomy','Exit'];

function typeIsHigh(code, dim) {
  const pos = { drive:0, fierce:1, explore:2, roam:3 };
  const highChars = ['D','F','E','R'];
  return code[pos[dim]] === highChars[pos[dim]];
}

function dimLabel(dim) {
  return currentLang === 'en' ? DIM_EN[DIM_KEYS.indexOf(dim)] : DIM_ZH[DIM_KEYS.indexOf(dim)];
}

// ── INITIALIZATION ─────────────────────────────────────────────────────────
(function init() {
  updateIntroLang();
  const params = new URLSearchParams(window.location.search);
  const from = params.get('from');
  const result = params.get('result');
  if (from && TYPES[from]) {
    fromType = from;
    const banner = document.getElementById('invite-banner');
    banner.style.display = 'block';
    const t = TYPES[from];
    const inviteMsg = currentLang === 'en' ? STRINGS.en.invite_banner(from, t.en) : STRINGS.zh.invite_banner(from, t.zh);
    banner.innerHTML = inviteMsg;
  }
  if (result && TYPES[result]) {
    showResult(result);
  }
})();

function updateIntroLang() {
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;
  document.getElementById('intro-desc-text').innerHTML = s.intro_desc.replace(/\n\n/g, '<br><br>');
  document.getElementById('btn-start-text').textContent = s.btn_start;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('hc16_lang', lang);
  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  rerenderCurrent();
}

function rerenderCurrent() {
  const introEl = document.getElementById('s-intro');
  const testEl = document.getElementById('s-test');
  const resultEl = document.getElementById('s-result');
  
  if (introEl.style.display !== 'none' && getComputedStyle(introEl).display !== 'none') {
    updateIntroLang();
  } else if (testEl.style.display !== 'none' && getComputedStyle(testEl).display !== 'none') {
    renderQuestion();
  } else if (resultEl.style.display !== 'none' && getComputedStyle(resultEl).display !== 'none' && window._myType) {
    showResult(window._myType);
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.display = 'none';
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  el.style.display = id === 's-intro' ? 'flex' : 'block';
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function startTest() {
  cur = 0;
  answers = new Array(16).fill(null);
  renderQuestion();
  show('s-test');
}

function retake() {
  startTest();
}

// ── QUESTION RENDERING ─────────────────────────────────────────────────────
function renderQuestion() {
  const q = Q[cur];
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;
  const pct = (cur / 16) * 100;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('p-dim').textContent = dimLabel(q.dim);
  document.getElementById('p-num').textContent = s.question_header(cur);
  document.getElementById('q-dim-label').textContent = dimLabel(q.dim);
  
  const text = currentLang === 'en' ? q.text_en : q.text;
  document.getElementById('q-text').textContent = text;

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  const optA = currentLang === 'en' ? q.a_en : q.a;
  const optB = currentLang === 'en' ? q.b_en : q.b;
  [['A', optA], ['B', optB]].forEach(([letter, txt]) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    if (answers[cur] === letter) btn.classList.add('selected');
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span class="opt-text">${txt}</span>`;
    btn.onclick = () => selectAnswer(letter);
    opts.appendChild(btn);
  });
}

function selectAnswer(letter) {
  answers[cur] = letter;
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  const idx = letter === 'A' ? 0 : 1;
  document.querySelectorAll('.opt-btn')[idx].classList.add('selected');
  setTimeout(() => {
    cur++;
    if (cur < 16) {
      renderQuestion();
    } else {
      calcResult();
    }
  }, 280);
}

// ── SCORING ────────────────────────────────────────────────────────────────
function calcResult() {
  const slices = [answers.slice(0,4), answers.slice(4,8), answers.slice(8,12), answers.slice(12,16)];
  const scores = slices.map(s => s.filter(a => a === 'A').length);
  const high = scores.map(s => s >= 3);
  const code = [
    high[0] ? 'D' : 'C',
    high[1] ? 'F' : 'T',
    high[2] ? 'E' : 'A',
    high[3] ? 'R' : 'B'
  ].join('');
  showResult(code);
}

// ── RESULT RENDERING ────────────────────────────────────────────────────────
function showResult(code) {
  const t = TYPES[code];
  if (!t) { showResult('DTAB'); return; }
  
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;

  window._myType = code;

  document.getElementById('result-eyebrow-text').textContent = s.result_eyebrow;
  document.getElementById('r-code').textContent = code;
  document.getElementById('r-zh').textContent = t.zh;
  document.getElementById('r-en').textContent = t.en;
  document.getElementById('r-tagline').textContent = currentLang === 'en' ? t.tagline_en : t.tagline;

  document.getElementById('section-profile').textContent = s.section_profile;
  document.getElementById('section-pattern').textContent = s.section_pattern;
  document.getElementById('section-pitfall').textContent = s.section_pitfall;
  document.getElementById('section-misread').textContent = s.section_misread;
  document.getElementById('section-works').textContent = s.section_works;

  // dims
  const dimsEl = document.getElementById('r-dims');
  const dimTexts = currentLang === 'en' ? t.dims_en : t.dims.map(d => d.text);
  dimsEl.innerHTML = dimTexts.map((text, i) => {
    const char = t.dims[i].char;
    return `<div class="dim-row"><div class="dim-char">${char}</div><div class="dim-text">${text}</div></div>`;
  }).join('');

  // pattern, pitfall
  const pattern = currentLang === 'en' ? t.pattern_en : t.pattern;
  const pitfall = currentLang === 'en' ? t.pitfall_en : t.pitfall;
  document.getElementById('r-pattern').innerHTML =
    pattern.split('\n\n').map(p => `<p class="result-para">${p}</p>`).join('');
  document.getElementById('r-pitfall').innerHTML =
    pitfall.split('\n\n').map(p => `<p class="result-para">${p}</p>`).join('');

  // misunderstood
  const misunderstood = currentLang === 'en' ? t.misunderstood_en : t.misunderstood;
  document.getElementById('r-misunderstood').innerHTML =
    misunderstood.map(m => `<div class="misunderstood-item">${m}</div>`).join('');

  // works
  const works_not = currentLang === 'en' ? t.works_not_en : t.works_not;
  const works_yes = currentLang === 'en' ? t.works_en : t.works;
  document.getElementById('r-works').innerHTML = `
    <div class="works-block">
      <div class="works-label">${s.works_not}</div>
      <div class="works-text">${works_not}</div>
    </div>
    <div class="works-block">
      <div class="works-label">${s.works_yes}</div>
      <div class="works-text">${works_yes}</div>
    </div>`;

  // compatibility
  const compatEl = document.getElementById('r-compat');
  if (fromType && TYPES[fromType] && fromType !== code) {
    compatEl.innerHTML = renderCompat(fromType, code);
  } else {
    compatEl.innerHTML = '';
  }

  // update buttons
  document.getElementById('btn-invite').textContent = s.btn_invite;
  document.getElementById('btn-share-text').textContent = s.btn_share;
  document.getElementById('btn-retake-text').textContent = s.btn_retake;
  document.getElementById('cta-back-text').textContent = s.cta_back;
  // link to individual type page
  const typePageBtn = document.getElementById('btn-type-page');
  typePageBtn.href = 'hc16/' + code + '.html';
  typePageBtn.textContent = currentLang === 'en' ? 'Full profile: ' + code + ' →' : '查看完整档案：' + code + ' →';

  show('s-result');
}

function renderCompat(t1, t2) {
  const s = currentLang === 'en' ? STRINGS.en : STRINGS.zh;
  const complement = [], friction = [], blindspot = [];
  DIM_KEYS.forEach((dim, i) => {
    const h1 = typeIsHigh(t1, dim);
    const h2 = typeIsHigh(t2, dim);
    if (h1 && h2) friction.push(i);
    else if (!h1 && !h2) blindspot.push(i);
    else complement.push(i);
  });

  const dimLabels = currentLang === 'en' ? DIM_EN : DIM_ZH;
  const chipHtml = (arr, cls) => arr.map(i =>
    `<span class="compat-chip ${cls}">${dimLabels[i]}</span>`).join('');

  return `
  <div class="compat-section">
    <div class="compat-header">
      <div>
        <div style="font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,240,232,0.25);margin-bottom:0.5rem;">${s.compat_title}</div>
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
          <span class="compat-type-chip">${t1}</span>
          <span class="compat-zh">${TYPES[t1].zh}</span>
          <span class="compat-x">×</span>
          <span class="compat-type-chip me">${t2}</span>
          <span class="compat-zh">${TYPES[t2].zh}</span>
        </div>
      </div>
    </div>
    <div class="compat-grid">
      ${complement.length ? `
      <div class="compat-row">
        <div class="compat-row-label">${s.compat_complement}</div>
        <div class="compat-row-text">${s.compat_complement_desc}</div>
        <div class="compat-chips">${chipHtml(complement,'green')}</div>
      </div>` : ''}
      ${friction.length ? `
      <div class="compat-row">
        <div class="compat-row-label">${s.compat_friction}</div>
        <div class="compat-row-text">${s.compat_friction_desc}</div>
        <div class="compat-chips">${chipHtml(friction,'amber')}</div>
      </div>` : ''}
      ${blindspot.length ? `
      <div class="compat-row">
        <div class="compat-row-label">${s.compat_blindspot}</div>
        <div class="compat-row-text">${s.compat_blindspot_desc}</div>
        <div class="compat-chips">${chipHtml(blindspot,'red')}</div>
      </div>` : ''}
    </div>
  </div>`;
}

// ── SHARING ────────────────────────────────────────────────────────────────
function shareInvite() {
  const code = window._myType || 'DTAB';
  const t = TYPES[code];
  const typeStr = currentLang === 'en' ? `${code} · ${t.en}` : `${code} · ${t.zh}`;
  const urlText = currentLang === 'en' ? 'See relationship analysis' : '看看我们之间的关系';
  const url = `https://nondubito.net/hc16.html?from=${code}`;
  const text = currentLang === 'en' 
    ? `I took HC-16, my type is ${typeStr}. Take the test too and we can see our compatibility — ${url}`
    : `我测了 HC-16，是 ${typeStr}。来测你的类型，看看我们之间的关系——${url}`;
  if (navigator.share) {
    navigator.share({ title: 'HC-16', text });
  } else {
    copyToClipboard(url, currentLang === 'en' ? 'Link copied' : '邀请链接已复制 →');
  }
}

function shareResult() {
  const code = window._myType || 'DTAB';
  const t = TYPES[code];
  const typeStr = currentLang === 'en' ? `${code} · ${t.en}` : `${code} · ${t.zh}`;
  const tagline = currentLang === 'en' ? t.tagline_en : t.tagline;
  const text = `HC-16: ${typeStr}\n"${tagline}"\nTake the test: https://nondubito.net/hc16.html`;
  if (navigator.share) {
    navigator.share({ title: `HC-16: ${typeStr}`, text, url: `https://nondubito.net/hc16.html?result=${code}` });
  } else {
    copyToClipboard(text, currentLang === 'en' ? 'Copied to clipboard' : '结果已复制到剪贴板');
  }
}

function copyToClipboard(text, msg) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast(msg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(msg);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
